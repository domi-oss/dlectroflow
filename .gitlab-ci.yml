# Avoid duplicate pipelines: run a merge-request pipeline for MRs, suppress the
# redundant branch pipeline while an MR is open, and run branch pipelines on main.
# Scheduled pipelines (weekly base-image rescan, Renovate, registry prune) are
# allowed explicitly.
# Version tags (vX.Y.Z) also get a pipeline — it builds + publishes the versioned
# release image (see build_image). Without this rule a tag push matches no rule
# and creates no pipeline. Tag pipelines never deploy (deploy jobs are MR/main only).
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - build         # build_app: npm ci + next build (compile)
  - build_image   # build_image: Kaniko assembles the image from build_app's artifacts
  - test          # security scanners (container_scanning needs the built image → after build_image)
  - deploy
  # Scheduled housekeeping (renovate, ops_digest, prune_registry,
  # security_assessment) plus one job that is NOT scheduled:
  # alert_pipeline_failure runs `when: on_failure` on main. It lives here because
  # it must read deploy_production's FINAL status, which means a stage after
  # `deploy` (#147).
  - maintenance

# ── Scheduled pipelines (issue #2, task 4.3 — base-image refresh cadence) ─────
# Four pipeline schedules drive maintenance (create in Settings → CI/CD → Schedules):
#   1. "Weekly base-image rescan"  → no extra variables. Rebuilds the image on the
#      current main and re-runs all scanners so new base/dependency CVEs surface in
#      the Vulnerability Report even when no code changed. Does NOT deploy. Also
#      carries ops_digest.
#   2. "Weekly Renovate"           → variable RENOVATE_RUN=true. Runs ONLY the
#      renovate job, which opens update MRs (npm deps + Docker base). Each MR then
#      runs the full scanner suite and is gated by review (see .gitlab/renovate.json).
#   3. "Weekly registry prune"     → variable REGISTRY_PRUNE=true. Runs ONLY the
#      prune_registry job, which bounds the main-* registry tag set (#114).
#   4. "Monthly security assessment" → variable SECURITY_ASSESSMENT=true. Runs ONLY
#      the security_assessment job, which files the dated work item that
#      .gitlab/duo/prompts/security-assessment.md requires, pre-filled with the
#      active-vulnerability snapshot (#134). The cadence was documented in
#      docs/quality-audit-prompts.md ## Cadence long before anything ran it, which
#      is how 8 unread HIGH findings accumulated in the baseline.
# Each flag variable gets a `when: never` guard on every OTHER scheduled job, so
# a flagged maintenance schedule runs its own job and nothing else — no duplicate
# ops digest, no pointless weekly rebuild. Add a flag, add its guards.
# `src/lib/security-assessment.test.ts` asserts that every rule block guarding
# one flag guards the others too, so a flag added to only some of them fails CI.

variables:
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  AGENT_CONTEXT: "gl-demo-ultimate-dtop/domi-oss/dlectroflow:dlectroflow"
  # ── Artifact/cache transfer speed ────────────────────────────────────────
  # Fastzip + fast compression cuts upload/download time for the sizeable
  # ci-dist/ artifact and the .next/.npm caches at a small size cost.
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  # ── Security Scanners ────────────────────────────────────────────────────
  # Container Scanning: target the image assembled by build_image
  CS_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  # SAST: skip generated/vendored paths
  SAST_EXCLUDED_PATHS: "node_modules, .next, ci-dist, coverage, prisma/migrations"
  # Advanced SAST: cross-file taint/dataflow analysis (Ultimate). Adds the
  # gitlab-advanced-sast job (rules override below). Honors SAST_EXCLUDED_PATHS
  # so ci-dist/ stays excluded, and dedupes findings against semgrep-sast.
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  # Dependency Scanning: lock-file only (no node_modules needed)
  DS_EXCLUDED_PATHS: "node_modules"
  # Secret Detection: exclude the generated Next.js build output staged for
  # Kaniko. ci-dist/ is gitignored (never committed), but excluding it here
  # keeps any future artifact-scanning from re-raising false positives such as
  # the PKCS8 "key" that is really a bundled `jose` library dist chunk.
  SECRET_DETECTION_EXCLUDED_PATHS: "ci-dist, .next, node_modules"

# ── GitLab security scanners ────────────────────────────────────────────────
# Canonical Jobs/* templates (the Security/* paths are the older alias). These
# default to *branch* pipelines; we override each job's rules below so they run
# in merge-request + main pipelines — that's what populates the MR security
# widget and the Vulnerability Report.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# Move the scanners off their branch-only default and onto MR + main pipelines.
# Also run them on the weekly rescan schedule (to re-detect drifting base CVEs),
# but never on the Renovate schedule (RENOVATE_RUN=true) — that runs only renovate.
#
# allow_failure is set per-rule: on MR pipelines the scanners are REQUIRED
# (allow_failure: false) so a scanner that can't run blocks the merge — closing
# the automerge fail-open where a broken scanner would let a Renovate MR through.
# On main we leave the template default (allow_failure: true) so a scanner flake
# can't block a production deploy. (Blocking on *findings* — new Critical/High —
# is the job of the Scan Result Policy, task 4.2, not job exit status.)
.scanner_rules: &scanner_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    allow_failure: false
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ── Docs-only fast path ──────────────────────────────────────────────────────
# Every path in this repo that is NOT purely documentation. Jobs that compile,
# test, build an image, scan that image or deploy a review app carry
# `changes: *code_changes` on their merge-request rule, so a documentation-only
# MR skips them.
#
# Why this is safe on MRs specifically: in a merge-request pipeline `changes:`
# is evaluated against the diff to the TARGET branch — the whole MR, not the
# last push. So the fast path engages only when an MR's *entire* diff is docs;
# an MR that touches one line of `src/` runs the full gate even if a later
# commit only edits a README. The rule is applied to the merge_request_event
# rule ONLY: `main`, version tags and the weekly rescan schedule keep running
# everything, which also avoids leaving `deploy_production` with an unbuildable
# image.
#
# Secret detection deliberately stays UNGATED (see its job below): a secret can
# absolutely be pasted into a README, and it also guarantees a docs-only
# pipeline still has at least one job (a pipeline with zero jobs fails to
# create).
#
# Keep this list exhaustive. A top-level path that is neither listed here nor
# in the docs allow-list would silently skip the whole gate, so
# `src/lib/ci-docs-only.ts` + its test assert that every top-level entry in the
# repo is classified by one of the two lists — add a new top-level file or
# directory and that test fails until you say which side it belongs on.
.code_changes: &code_changes
  # Directories that hold source, schema, infra or CI configuration
  - "src/**/*"
  - "e2e/**/*"
  - "prisma/**/*"
  - "public/**/*"
  - "charts/**/*"
  - "scripts/**/*"
  - ".gitlab/**/*"
  # Everything Docker: the two Dockerfiles CI builds the image from, plus the
  # Caddyfile and both Compose files of the single-host deployment stack (#102).
  # The stack is not exercised by CI, but it is deployment configuration rather
  # than documentation, so a change to it runs the gate rather than taking the
  # docs-only fast path. One directory glob replaces the old `Dockerfile*` +
  # `Caddyfile` root entries, so a new file added under docker/ is covered
  # automatically instead of needing its own line here.
  - "docker/**/*"
  # Root-level code + config. `*` does not cross `/`, so these match the repo
  # root only; leading-dot files are listed explicitly because a `*` glob does
  # not match them.
  - "*.ts"
  - "*.mjs"
  - "*.json"
  - "*.yml"
  - "*.yaml"
  # Stays at the root even though it is Docker's: the build context is the repo
  # root, and Docker only reads .dockerignore from there.
  - ".dockerignore"
  - ".env.example"
  - ".env.prod.example"
  - ".gitignore"
  - ".nvmrc"
  - ".prettierignore"

# Scanner rules for the analyzers that only tell us something about code.
# Identical to *scanner_rules except the merge-request rule is gated on
# *code_changes. container_scanning is included because it needs build_image,
# which is itself gated — a dangling `needs` would fail pipeline creation.
.code_scanner_rules: &code_scanner_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *code_changes
    allow_failure: false
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# Source-only scanners get needs: [] so they start at pipeline start, in
# parallel with build_app, instead of waiting behind both build stages.
# interruptible: true lets a newer pipeline on the same ref cancel them.
semgrep-sast:
  needs: []          # scans source only — no build output required
  interruptible: true
  rules: *code_scanner_rules

# Advanced SAST ships as its own job and (like the others) defaults to
# branch-only — give it the same overrides so it runs in MR + main pipelines
# and populates the MR security widget.
gitlab-advanced-sast:
  needs: []          # scans source only — no build output required
  interruptible: true
  rules: *code_scanner_rules

gemnasium-dependency_scanning:
  needs: []          # scans package-lock.json only — no build output required
  interruptible: true
  rules: *code_scanner_rules

# #53 (dedupe secret detection): this template job (from the
# Jobs/Secret-Detection.gitlab-ci.yml include above) is the single AUTHORITATIVE
# secret scan — BLOCKING on MRs (allow_failure:false via *scanner_rules) and run
# on main + tags. A second, NON-blocking policy-driven scan (`secret-detection-0`,
# allow_failure:true) is injected by a Scan Execution Policy in the separate
# security-policy project; it duplicates this one and is a flake source (it 502'd
# on 2026-07-24). The dedup = remove THAT policy scan in the security-policy
# project (owner/member action — it lives in another project, so it can't be
# edited from this repo). Do NOT delete this include as the "fix": that would
# leave only the non-blocking policy scan and drop the blocking gate.
secret_detection:
  needs: []          # scans git history only — no build output required
  interruptible: true
  rules: *scanner_rules

container_scanning:
  # Scans the image assembled by build_image (the build job was split into
  # build_app + build_image). needs it so the image exists before scanning.
  needs: ["build_image"]
  interruptible: true
  rules: *code_scanner_rules

# ── Docs-only scan stubs (#116) ──────────────────────────────────────────────
# Skipping the four jobs above is not free. The approval policy "Require
# approval for new Critical or High vulnerabilities" (in the linked
# security-policy project) compares the security report TYPES present in the
# merge request's pipeline against those in main's. A type main has and the MR
# does not is a `scan_removed` violation, and the policy's
# `fallback_behavior: fail: closed` turns an unevaluable rule into a required
# approval. So EVERY docs-only MR came back
# `detailed_merge_status: security_policy_violations` and could not merge until
# the single eligible approver clicked approve — on a README typo. Measured on
# !193's pipeline: `sast`, `dependency_scanning` and `container_scanning` all
# absent, `secret_detection` present. Those three are exactly what this job
# supplies, as EMPTY reports.
#
# Why not the alternatives:
#   • Scope the policy to "only when code changed" — not expressible. Approval
#     policy scoping is by project, group, compliance framework and target
#     branch; there is no changed-path predicate.
#   • `fallback_behavior: fail: open` — one line, and it would fix this. It
#     would also make every OTHER unevaluable rule pass, including a code MR
#     whose SAST job errored out. That is precisely the fail-open that
#     `allow_failure: false` above was written to close. Rejected: it trades a
#     docs papercut for a hole in the gate that matters.
#   • Run the real scanners on docs-only MRs — correct, and hands back most of
#     what #53 bought. container_scanning alone drags in build_app +
#     build_image, i.e. the whole pipeline.
#
# What makes an empty report honest rather than a lie: the rule below is the
# exact inverse of the merge-request rule in *code_scanner_rules — same
# `changes: *code_changes` anchor — so this job can only run on a diff in which
# no code path changed at all. Nothing was scanned because nothing changed that
# main's own scan of the same code does not already cover. The job says so, in
# those words, in its log, and prints the diff it is making that claim about.
#
# The failure mode this replaces was silent, so the replacement is guarded:
# `src/lib/ci-docs-only.ts` + its test assert that the jobs gated on
# *code_scanner_rules and the report types stubbed here stay in step. Add a
# fifth code-gated scanner and the suite fails until it is stubbed too.
docs_only_scan_stub:
  stage: test
  # Same pinned digest as build_app/test_app — one image for Renovate to bump,
  # and node writes the reports (JSON.stringify cannot emit malformed JSON the
  # way a shell heredoc can).
  image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
  needs: []          # nothing to wait for; finishes in seconds
  interruptible: true
  variables:
    # The diff base is an ancestor of the checked-out MR head, and a shallow
    # clone can cut it off — take the whole history so the audit line below is
    # always printable. ~33 MB, a couple of seconds.
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git   # node:22-alpine ships without it (see test_app)
  script:
    - |
      echo "=============================================================="
      echo " docs_only_scan_stub — THIS JOB SCANS NOTHING."
      echo "=============================================================="
      echo " This merge request's diff matched none of the .code_changes"
      echo " globs in .gitlab-ci.yml, so the docs-only fast path (#53) did"
      echo " not run semgrep-sast, gitlab-advanced-sast,"
      echo " gemnasium-dependency_scanning or container_scanning."
      echo ""
      echo " The reports written below are EMPTY BY CONSTRUCTION. They are"
      echo " not scan results. They exist so the approval policy can compare"
      echo " this pipeline against main's and see the same set of scan"
      echo " types, instead of reading 'scanner absent' as 'unresolved"
      echo " finding' and blocking the merge request (#116)."
      echo ""
      echo " They assert nothing about the code: no code path is in this"
      echo " diff, so main's scan of that code is still the current answer."
      echo "--------------------------------------------------------------"
      echo " Files changed in this merge request:"
      if changed="$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD 2>&1)"; then
        echo "$changed" | sed 's/^/   /'
      else
        echo "   (diff base $CI_MERGE_REQUEST_DIFF_BASE_SHA unreachable:"
        echo "    $changed)"
        echo "   See the merge request's Changes tab instead."
      fi
      echo "=============================================================="
    - |
      # Schema version is pinned, not latest: GitLab rejects a report whose
      # version it has no schema for, and a rejected report registers no scan
      # type — which would silently restore the bug. 15.2.1 sits inside the
      # range GitLab.com accepted on 2026-07-31 (semgrep-sast emitted 15.2.2,
      # container_scanning 15.1.1 on pipeline 2720996501). If a docs-only MR is
      # ever blocked again, check this first: the pipeline's
      # securityReportSummary shows null for a report type GitLab refused.
      node -e '
        const { writeFileSync } = require("node:fs");
        const stamp = new Date().toISOString().slice(0, 19);
        const tool = {
          id: "dlectroflow-docs-only-fast-path",
          name: "dlectroflow docs-only fast path (no scan performed)",
          url: "https://gitlab.com/gl-demo-ultimate-dtop/domi-oss/dlectroflow/-/issues/116",
          version: "1.0.0",
          vendor: { name: "dlectroflow CI (.gitlab-ci.yml)" },
        };
        const report = (type) =>
          JSON.stringify(
            {
              version: "15.2.1",
              scan: {
                type,
                status: "success",
                start_time: stamp,
                end_time: stamp,
                analyzer: tool,
                scanner: tool,
              },
              vulnerabilities: [],
            },
            null,
            2,
          );
        // These pairs and the artifacts:reports: block below are two lists of
        // the same thing, so they are compared by
        // src/lib/ci-docs-only.test.ts. Declaring a report and forgetting to
        // write it is the quietest way back to #116: the runner logs
        // `no matching files`, the job still SUCCEEDS, and GitLab registers no
        // scan for that type.
        for (const [type, file] of [
          ["sast", "gl-sast-report.json"],
          ["dependency_scanning", "gl-dependency-scanning-report.json"],
          ["container_scanning", "gl-container-scanning-report.json"],
        ]) {
          writeFileSync(file, report(type));
          console.log(`wrote empty ${type} report -> ${file}`);
        }
      '
  artifacts:
    # `reports:` is what registers the scan type with GitLab and is the whole
    # point. `paths:` keeps the same files browsable so anyone auditing the
    # merge request can open them and confirm `"vulnerabilities": []`.
    # Every entry under `reports:` must have a matching pair in the script
    # above — asserted by src/lib/ci-docs-only.test.ts, filenames included.
    paths:
      - gl-sast-report.json
      - gl-dependency-scanning-report.json
      - gl-container-scanning-report.json
    reports:
      sast: gl-sast-report.json
      dependency_scanning: gl-dependency-scanning-report.json
      container_scanning: gl-container-scanning-report.json
    expire_in: 1 week
  rules:
    # Exact inverse of *code_scanner_rules, by construction: the same
    # *code_changes anchor. A diff that runs the real scanners never runs this
    # job, and a diff that runs this job never had a scanner to skip.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code_changes
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # No main / tag / schedule rules on purpose: there the real scanners always
    # run, and a stub report alongside them would put a scanner that scanned
    # nothing into the Vulnerability Report.

# ── Build: compile (build_app) then assemble image (build_image) ─────────────
# Runs npm ci + next build in a standard Node runner with GitLab file cache.
# .next/cache is preserved between runs for Next.js incremental compilation;
# .npm/ keeps npm's tarball cache so npm ci reinstalls from disk, not network.
build_app:
  stage: build
  # alpine (musl) so npm ci + next build produce musl-matched native binaries
  # (esp. the Prisma engine) that the alpine runtime image can execute.
  image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
  interruptible: true  # superseded pipelines on the same ref cancel this job
  before_script:
    - apk add --no-cache openssl   # Prisma engine needs libssl; targets come from schema.prisma
  script:
    # --cache .npm keeps tarballs in the CI cache; --prefer-offline uses them
    # without a registry round-trip; --no-audit/--no-fund skip extra requests.
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    # Stage the build output under ci-dist/ (NOT .next/): .dockerignore excludes
    # .next, and Kaniko honors it, so a .next/* artifact would be stripped from
    # the image context. ci-dist/ is not ignored, so it survives into Kaniko.
    - mkdir -p ci-dist
    - cp -r .next/standalone ci-dist/standalone
    - cp -r .next/static ci-dist/static
  cache:
    key:
      files:
        - package-lock.json
    # npm ci deletes node_modules/ before installing, so caching it is pure
    # up/download overhead — cache npm's tarball store (.npm/) and Next's
    # incremental build cache (.next/cache/) instead.
    paths:
      - .npm/
      - .next/cache/
  artifacts:
    # Pass only the pre-built output to build_image (staged outside .next/).
    paths:
      - ci-dist/
      - public/
      - prisma/
      - prisma.config.ts
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code_changes
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: compile so build_image can assemble the release image.
    - if: '$CI_COMMIT_TAG'

# ── Test gate (#21 P3): tsc + eslint + env-drift + vitest ahead of image/deploy ─
# Next 16's `next build` neither runs tests nor lints, so before this job a red
# suite (or lint) could ride any compiling main commit straight into
# deploy_production. Gating is double: build_image `needs` this job, and
# deploy_production is stage-scheduled behind the build stage on main.
# The env-drift check (#30) is folded in here rather than a separate job: it's
# a cheap, DB-free static check (like tsc/lint) that reuses the same npm ci —
# a standalone job would only add another install + runner spin-up for no
# benefit.
test_app:
  stage: build
  image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
  interruptible: true
  needs: []          # starts at pipeline start, in parallel with build_app
  # Real Postgres for the *.integration.test.ts files (they exercise actual
  # queries — e.g. workspace scoping — and skipping them in CI would gate on
  # less than the local suite runs).
  services:
    - postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
  variables:
    POSTGRES_USER: dlectroflow
    POSTGRES_PASSWORD: ci-test-only
    POSTGRES_DB: dlectroflow_test
    # Compose from the POSTGRES_* vars above rather than embedding the literal
    # password (avoids a "password in URL" secret-detection hit; DRY).
    DATABASE_URL: "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?schema=public"
  before_script:
    # openssl: Prisma engine libssl (postinstall runs prisma generate).
    # git: node:22-alpine ships without it, and src/lib/ci-docs-only.test.ts
    # shells out to `git ls-tree` to enumerate committed top-level paths — that
    # is the source of truth for "what is in the repo", and reading the working
    # directory instead would drag in node_modules/, ci-dist/ and every local
    # artefact. ~2 MB, under a second.
    # bash + jq: src/lib/registry-prune.test.ts runs the REAL prune script
    # (scripts/prune-registry.sh, which deletes registry tags) with curl and
    # kubectl stubbed, so it needs the shell and the JSON parser that script
    # uses. Alpine's /bin/sh is busybox and neither tool is present by default;
    # the first CI run of that suite failed 28 assertions with an EMPTY stderr,
    # because spawning `bash` had failed rather than the script. That test file
    # now checks for both up front and names this line.
    - apk add --no-cache openssl git bash jq
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx tsc --noEmit
    # Errors fail the gate. The react-hooks compiler-era rules were warn-level
    # while #23 burned down the backlog; that landed in !160, so purity,
    # set-state-in-effect and refs are all at ERROR now and block CI. New
    # violations are bugs, not backlog. See eslint.config.mjs.
    - npm run lint
    # #32: fail the gate on unformatted code. Config in prettier.config.mjs
    # (double quotes, semicolons, 2-space, trailing-comma:all, 80 cols — the
    # style the tree already follows); scope carved by .prettierignore (app code
    # + JSON/CSS, not docs/infra YAML). Cheap static check, reuses this npm ci.
    - npm run format:check
    # #30: keeps .env.example honest — fails on a process.env read in src/
    # that isn't documented, or a documented key nothing reads any more (see
    # src/lib/env-drift.ts for the diff logic + intentional-exception allowlist).
    - npm run check:env
    - npx prisma migrate deploy   # schema for the integration tests' service DB
    - npm run test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    # pull-only: build_app owns the cache upload (incl. .next/cache/); a push
    # from here would overwrite that zip with one missing the Next build cache.
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code_changes
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: gate the release image on a green suite too (build_image needs this).
    - if: '$CI_COMMIT_TAG'

# ── E2E gate (#37): Playwright smoke suite against a real Postgres and the
# real shipped artefact — `next build`, then the standalone `server.js` ───────
# #97: the suite used to boot `next start`, which Next 16 warns is unsupported
# with `output: "standalone"` and which is not what any environment runs. It now
# boots `node .next/standalone/server.js` — the same entrypoint as the deployed
# image's `CMD` — with `public/` and `.next/static` grafted on the way
# docker/Dockerfile.ci grafts them (the bundle omits both; skip the copy and every HTML
# route still answers 200 while every stylesheet and client chunk 404s).
# playwright.config.ts owns that assembly, so this job is unchanged: the
# `npm run build` below already produced `.next/standalone`, and the copy costs
# ~0.2s for 31 MB. src/lib/dockerfile-hygiene.test.ts keeps the two sides in
# lock-step.
# The Playwright image is Debian/glibc (required for the bundled browsers) and
# ships Node, so no apk/openssl before_script is needed here (unlike test_app's
# alpine image) — npm ci's postinstall (`prisma generate`) downloads the
# Debian-matched engine directly. Auth/session boot-guard env vars are supplied
# by playwright.config.ts's webServer.env, so this job only needs the
# Postgres/DB vars, same as test_app.
#
# #31: this job also runs the mechanical accessibility (axe) gate — the axe spec
# is just another *.spec.ts under testDir (e2e/a11y/axe-core-flow.spec.ts), so
# `npx playwright test` already picks it up. It fails on NEW serious/critical
# WCAG violations vs. e2e/a11y/axe-baseline.json. No separate job needed: the
# gate inherits e2e_test's Postgres service + build + build_image.needs blocking.
e2e_test:
  stage: build
  image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
  interruptible: true
  needs: []          # starts at pipeline start, in parallel with build_app
  services:
    - postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
  variables:
    POSTGRES_USER: dlectroflow
    POSTGRES_PASSWORD: ci-test-only
    POSTGRES_DB: dlectroflow_test
    # Compose from the POSTGRES_* vars above rather than embedding the literal
    # password (avoids a "password in URL" secret-detection hit; DRY).
    DATABASE_URL: "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?schema=public"
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx prisma migrate deploy   # schema for the smoke suite's service DB
    - npm run build
    - npx playwright test
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 1 week
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    # pull-only: build_app owns the cache upload (incl. .next/cache/); a push
    # from here would overwrite that zip with one missing the Next build cache.
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code_changes
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: build_image publishes the release image on tags and now
    # needs e2e_test, so the gate MUST exist on tag pipelines too (mirrors
    # test_app) — otherwise build_image is skipped and no release image ships.
    - if: '$CI_COMMIT_TAG'

# Assembles the final image from build_app's artifacts using docker/Dockerfile.ci.
# Kaniko does no compilation here — COPY + npm install prisma only — so the
# remaining layers are very stable and almost always cache hits.
build_image:
  stage: build_image
  interruptible: true  # superseded pipelines on the same ref cancel this job
  # #53 (reparallelize): build_image only consumes build_app's compiled artifacts,
  # not the test results, so it needs build_app ONLY and starts the moment those
  # artifacts are ready (~90s) instead of idling ~50–120s behind test_app +
  # e2e_test. The "no deploy from a red suite" gate moved DOWNSTREAM and is fully
  # preserved: deploy_review now needs [build_image, test_app, e2e_test], and
  # deploy_production stays stage-scheduled (no explicit needs) behind the whole
  # build stage. Trade-off (accepted, #53): on MR/main the image can be pushed
  # even when the suite is red — but such an image is never deployed (MR SHA tags
  # are reaped by the cleanup policy; a red main-<sha> is kept but never rolled
  # out). The one exception is a TAG pipeline, which PUBLISHES :vX.Y.Z + :latest
  # (issue #12 §5): a flaky suite must never publish a release image, so the
  # rules:needs override on the tag rule below re-adds the full test gate there.
  needs:
    - job: build_app
      artifacts: true
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # On main, ALSO push a stable main-<short-sha> tag. deploy_production pulls
    # this tag, and the container-registry cleanup policy's keep-regex (main-.*)
    # protects it permanently — so cleanup can never delete the image prod runs.
    # (Protecting main-* only helps because prod pulls it: deleting an untagged
    # SHA would 404 even though the same digest survives under another tag.)
    # Review/MR pipelines push only the ephemeral SHA tag, which cleanup reaps.
    - |
      DESTS="--destination $IMAGE"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DESTS="$DESTS --destination $CI_REGISTRY_IMAGE:main-$CI_COMMIT_SHORT_SHA"
      fi
      # On a version tag (vX.Y.Z), publish the release image under its version
      # and move :latest to it — the tag pipeline's whole purpose (issue #12 §5).
      # No deploy runs on a tag (deploy jobs are MR/main only), so this only
      # publishes; the human rolls it out separately if/when desired.
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE:latest"
      fi
    # --context stays the REPO ROOT while --dockerfile points into docker/.
    # They are independent: the Dockerfile's `COPY prisma`, `COPY public` and
    # `COPY ci-dist/...` all resolve against the context, so narrowing it to
    # docker/ would fail every one of them. Only the recipe moved.
    # --build-arg BUILD_SHA (#135): bakes the commit into the image so
    # /api/health can report it and the two instances can be asserted to be on
    # the same commit. The image tag already IS the SHA, but a running container
    # cannot read the tag it was pulled under. The full SHA is passed and
    # src/lib/build-info.ts shortens it, so both instances shorten identically.
    # It is the LAST ARG/ENV pair in Dockerfile.ci, so changing every commit
    # invalidates only the trailing metadata layers, not the cached ones.
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile.ci"
        --build-arg "BUILD_SHA=$CI_COMMIT_SHA"
        $DESTS
        --cache=true
        --cache-repo "$CI_REGISTRY_IMAGE/cache"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code_changes
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: assemble + push the versioned release image and :latest.
    # Release-gate guard (#53): rules:needs REPLACES the job-level needs when this
    # rule matches, so re-add the full test gate here — a release image must never
    # be published from a red suite (build_app is re-listed because rules:needs is
    # a full replacement, not a merge).
    - if: '$CI_COMMIT_TAG'
      needs:
        - job: build_app
          artifacts: true
        - job: test_app
          artifacts: false
        - job: e2e_test
          artifacts: false

# ── Deploy ───────────────────────────────────────────────────────────────────
.deploy_base:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3.19.1@sha256:d02d8d02a24d67e4851503cc443e7eb2358383c9c052f699c262409cd05dae55   # bundles helm + kubectl
    entrypoint: [""]
  before_script:
    - chmod 600 "$KUBECONFIG"   # tighten perms on the runner-generated kubeconfig (silences Helm's group-readable warning)
    - kubectl config use-context "$AGENT_CONTEXT"

deploy_review:
  extends: .deploy_base
  # #53: the "no deploy from a red suite" gate now lives HERE — it moved off
  # build_image (so the image build starts right after build_app), so deploy_review
  # must need the test + e2e gates in addition to the image. The scanners are
  # allow_failure: true and never gate the review deploy, so they stay OUT of needs
  # (waiting on the test *stage* for them would be pure delay). deploy_production
  # keeps the same gate via stage scheduling (no explicit needs) so scan results
  # also land before a prod rollout.
  # Explicit long form (matches the tag-rule override above): deploy_review
  # consumes none of these jobs' artifacts — it deploys the pushed image via helm.
  needs:
    - job: build_image
      artifacts: false
    - job: test_app
      artifacts: false
    - job: e2e_test
      artifacts: false
  # Serialize helm per review env: deploy jobs aren't interruptible, so a
  # quick follow-up push otherwise races the previous pipeline's still-running
  # helm op on the same release → "another operation is in progress" (hit on
  # !46). Same group as stop_review so a deploy can't race the teardown either.
  resource_group: review/$CI_MERGE_REQUEST_IID
  secrets:
    ANTHROPIC_API_KEY:
      gitlab_secrets_manager: { name: ANTHROPIC_API_KEY, source: group/gl-demo-ultimate-dtop }
      file: false
    POSTGRES_PASSWORD:
      gitlab_secrets_manager: { name: POSTGRES_PASSWORD, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN_USER:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN_USER, source: group/gl-demo-ultimate-dtop }
      file: false
  script:
    # Per-deploy random session-signing key for the ephemeral review app — never
    # committed. Rotating it each deploy only resets guest cookies (review holds
    # no real data), and avoids shipping a known signing key in the repo.
    - AUTH_SESSION_SECRET=$(cat /proc/sys/kernel/random/uuid /proc/sys/kernel/random/uuid | tr -cd 'a-fA-F0-9')
    # Phase 2 — dummy per-deploy guest IP-hash salt so the prod-mode boot guard
    # starts in the ephemeral review app (holds no real guest data).
    - GUEST_IP_HASH_SALT_REVIEW=$(cat /proc/sys/kernel/random/uuid /proc/sys/kernel/random/uuid | tr -cd 'a-fA-F0-9')
    # #21 P2 — dummy per-deploy AES-256-GCM key so the boot guard starts in the
    # ephemeral review app (holds no real OAuth tokens). od/tr are busybox
    # built-ins; avoid openssl (not in this Alpine deploy image).
    - TOKEN_ENC_KEY=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
    # --timeout 15m (was 10m) for the same Autopilot cold-scale + ~893MB image
    # pull reason documented on the production job below. Review apps land on
    # fresh spot nodes more often, but run a single replica, so they need less
    # headroom than prod's 20m.
    - helm upgrade --install "dlectroflow-mr-$CI_MERGE_REQUEST_IID" charts/dlectroflow
        --namespace "dlectroflow-mr-$CI_MERGE_REQUEST_IID" --create-namespace
        --set env=review --set spot=true --set postgres.persistent=false
        --set replicas=1
        --set-string image.tag="$CI_COMMIT_SHA"
        --set-string host="mr-$CI_MERGE_REQUEST_IID.35-246-93-255.sslip.io"
        --set-string secrets.postgresPassword="$POSTGRES_PASSWORD"
        --set-string secrets.anthropicApiKey="$ANTHROPIC_API_KEY"
        --set-string auth.ownerAllowlist="0"
        --set-string secrets.authSessionSecret="$AUTH_SESSION_SECRET"
        --set-string secrets.gitlabOauthClientId="review-unused"
        --set-string secrets.gitlabOauthClientSecret="review-unused"
        --set-string secrets.guestIpHashSalt="$GUEST_IP_HASH_SALT_REVIEW"
        --set-string secrets.tokenEncKey="$TOKEN_ENC_KEY"
        --set-string registry.username="$GITLAB_DEPLOY_TOKEN_USER"
        --set-string registry.password="$GITLAB_DEPLOY_TOKEN"
        --set resources.app.cpu=250m
        --atomic --timeout 15m
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: https://mr-$CI_MERGE_REQUEST_IID.35-246-93-255.sslip.io
    on_stop: stop_review
    # Review apps are looked at within minutes of the pipeline going green, or
    # not at all — but every one that stays up holds an app pod + a Postgres pod
    # on billable Autopilot capacity until it is stopped. 12 hours covers a full
    # working day of review while cutting the idle tail (it was 2 days). Stopping
    # is not destructive to the MR: GitLab keeps the environment, and re-running
    # deploy_review from the pipeline brings it straight back.
    auto_stop_in: 12 hours
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code_changes

stop_review:
  extends: .deploy_base
  resource_group: review/$CI_MERGE_REQUEST_IID
  # #145 — needs: [] is load-bearing, not tidiness. Without an explicit needs:,
  # GitLab gives a job an implicit dependency on EVERY job in every earlier
  # stage. This job is in `deploy`, so that meant build + build_image + test.
  # Once those artifacts expired the dependency could no longer be satisfied and
  # the job failed with `missing_dependency_failure` BEFORE running its script
  # (`started_at: null`, empty log) — permanently, for that pipeline.
  #
  # The consequence was not a red pipeline, because of allow_failure below. It
  # was that `kubectl delete namespace` never ran: the environment wedged in
  # `stopping` (GitLab lists those as *Active*) and an app pod plus a Postgres
  # StatefulSet kept running for merged MRs at ~$20/month each. Six environments
  # were stuck this way, the oldest since 11 July, and the auto-stop timer was
  # decorative the whole time. .deploy_base deliberately declares no needs — the
  # deploy jobs each state their own — so inheriting from it is what left this
  # one implicit.
  #
  # [] rather than a list because this job consumes no artifacts at all: it runs
  # helm and kubectl against a live cluster. It also lets teardown start
  # immediately instead of queueing behind a build it does not use.
  # Asserted by src/lib/ci-job-deps.test.ts.
  needs: []
  script:
    - helm uninstall "dlectroflow-mr-$CI_MERGE_REQUEST_IID" --namespace "dlectroflow-mr-$CI_MERGE_REQUEST_IID" || true
    - kubectl delete namespace "dlectroflow-mr-$CI_MERGE_REQUEST_IID" --ignore-not-found
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code_changes
      when: manual
  # Kept true: a teardown that cannot reach the cluster must not block a merge,
  # and the script is already written not to fail (`|| true`, --ignore-not-found).
  # With needs: [] the one failure mode it was masking is gone. The remaining
  # risk — a genuine cluster-side failure passing unnoticed — is covered by the
  # orphan sweep tracked in #145, not by making this gate a merge.
  allow_failure: true

deploy_production:
  extends: .deploy_base
  # Serialize prod helm ops (rapid successive merges to main would otherwise
  # race each other the same way review deploys can).
  resource_group: production
  secrets:
    ANTHROPIC_API_KEY:
      gitlab_secrets_manager: { name: ANTHROPIC_API_KEY, source: group/gl-demo-ultimate-dtop }
      file: false
    POSTGRES_PASSWORD:
      gitlab_secrets_manager: { name: POSTGRES_PASSWORD, source: group/gl-demo-ultimate-dtop }
      file: false
    GOOGLE_CLIENT_ID:
      gitlab_secrets_manager: { name: GOOGLE_CLIENT_ID, source: group/gl-demo-ultimate-dtop }
      file: false
    GOOGLE_CLIENT_SECRET:
      gitlab_secrets_manager: { name: GOOGLE_CLIENT_SECRET, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN_USER:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN_USER, source: group/gl-demo-ultimate-dtop }
      file: false
  script:
    # image.tag is the protected main-<short-sha> tag (kept forever by the
    # registry cleanup policy), never the ephemeral bare SHA which cleanup reaps.
    #
    # --timeout 20m (was 10m): 10m is not enough for a COLD rollout on GKE
    # Autopilot. The !151 deploy failed with "context deadline exceeded" and
    # --atomic rolled it back, purely on time — the pods were healthy. Autopilot
    # had to scale for memory ("0/7 nodes are available: Insufficient memory"),
    # and each new node then spent ~1m20s pulling the ~893MB image; two replicas
    # with a spread constraint means that happens on more than one node. A plain
    # retry (warm nodes, image already pulled) then succeeded in ~6m.
    # --atomic still guarantees rollback, so the cost of a longer timeout is only
    # slower rollback on a genuinely bad deploy; the benefit is not rolling back
    # good ones. The real lever is the image size — see the follow-up issue.
    #
    # ── Hostnames (#130) ──────────────────────────────────────────────────────
    # `host` does three jobs at once: the ingress rule, the TLS SAN, and
    # PUBLIC_ORIGIN — the app derives it as https://{{ .Values.host }} (see
    # charts/dlectroflow/templates/deployment.yaml), and that value pins the OAuth
    # redirect URIs against Host / X-Forwarded-* spoofing. So there is exactly ONE
    # auth origin per deployment: two hostnames can be SERVED, but only one can
    # complete a sign-in. Changing `host` is therefore atomic, not gradual, and it
    # invalidates existing Google connections — the redirect URI moves with it.
    #
    # This cluster is served on a subdomain rather than the apex, deliberately.
    # Its sign-ins are tied to one OAuth client, and the apex is reserved for a
    # deployment with a longer expected life than this one — so the canonical
    # host here is the subdomain and the apex stays uncommitted.
    #
    # Kept deliberately non-specific: this file is public and mirrored, and the
    # deployment topology behind it is not the reader's business. The operational
    # detail lives in the linked issue.
    #
    # legacyHosts[1] is the apex, served by this SAME cluster during the overlap
    # and served WITHOUT a redirect — the subtle bit. `legacyHosts` only adds a
    # host to the ingress and the multi-SAN cert; the 301 is a SEPARATE hardcoded
    # rule in next.config.ts matching dlectroflow.dlectronique.dev alone, so a host
    # listed here but absent from that rule is simply served. That is deliberate:
    # Google is verifying the OAuth consent screen against https://dlectroflow.dev
    # right now, and its homepage / privacy / terms checks want a 200, not a hop.
    # Do NOT add the apex to the next.config.ts redirect until verification has
    # cleared AND the apex has moved to the instance that keeps it.
    #
    # Both hostnames must also be in cert-manager's hostAliases or the HTTP-01
    # self-check never completes on GKE and the cert silently never issues —
    # docs/deploy-runbook.md §4.
    - helm upgrade --install dlectroflow charts/dlectroflow
        --namespace dlectroflow-prod --create-namespace
        --set env=production --set postgres.persistent=true
        --set-string image.tag="main-$CI_COMMIT_SHORT_SHA"
        --set-string host="work.dlectroflow.dev"
        --set-string "legacyHosts[0]=dlectroflow.dlectronique.dev"
        --set-string "legacyHosts[1]=dlectroflow.dev"
        --set-string secrets.postgresPassword="$POSTGRES_PASSWORD"
        --set-string secrets.anthropicApiKey="$ANTHROPIC_API_KEY"
        --set-string secrets.googleClientId="$GOOGLE_CLIENT_ID"
        --set-string secrets.googleClientSecret="$GOOGLE_CLIENT_SECRET"
        --set-string auth.ownerAllowlist="$OWNER_ALLOWLIST"
        --set-string secrets.authSessionSecret="$AUTH_SESSION_SECRET"
        --set-string secrets.gitlabOauthClientId="$GITLAB_OAUTH_CLIENT_ID"
        --set-string secrets.gitlabOauthClientSecret="$GITLAB_OAUTH_CLIENT_SECRET"
        --set-string secrets.guestIpHashSalt="$GUEST_IP_HASH_SALT"
        --set-string secrets.tokenEncKey="$TOKEN_ENC_KEY"
        --set-string registry.username="$GITLAB_DEPLOY_TOKEN_USER"
        --set-string registry.password="$GITLAB_DEPLOY_TOKEN"
        --set backup.enabled=true
        --set-string backup.gcsBucket="$BACKUP_GCS_BUCKET"
        --set-string backup.gcpServiceAccount="$BACKUP_GCP_SA"
        --set backup.b2.enabled="${BACKUP_B2_ENABLED:-false}"
        --set-string backup.b2.bucket="$BACKUP_B2_BUCKET"
        --set-string secrets.b2KeyId="$BACKUP_B2_KEY_ID"
        --set-string secrets.b2AppKey="$BACKUP_B2_APP_KEY"
        --atomic --timeout 20m
  environment:
    name: production
    url: https://dlectroflow.dev
  rules:
    # Never deploy from a scheduled pipeline (the weekly rescan rebuilds + scans
    # only; base bumps reach prod via a Renovate MR merged to main → push pipeline).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Renovate: automated dependency + base-image update MRs ────────────────────
# Self-hosted Renovate, run by the "Weekly Renovate" schedule (RENOVATE_RUN=true).
# Behaviour is configured in .gitlab/renovate.json (npm deps + Docker base, pinned digests,
# automerge for patch/minor/digest once the pipeline — incl. scanners — is green).
# Requires a masked CI/CD variable RENOVATE_TOKEN with `api` scope and Maintainer
# role (merge rights for automerge). Use a Personal Access Token or a service-account
# token — NOT a project access token (Renovate's GitLab platform init calls
# GET /api/v4/user, which a project-access-token bot user cannot authenticate).
# The project variable is auto-injected into this job's environment; do NOT re-map
# it as `RENOVATE_TOKEN: "$RENOVATE_TOKEN"` — that self-reference resolves to empty
# and shadows the real value (Renovate then sees no token → 401 unauthenticated).
renovate:
  stage: maintenance
  # Digest-pinned (supply-chain): the major tag is a moving target. Renovate's own
  # gitlabci manager (docker:pinDigests in .gitlab/renovate.json) keeps this digest fresh.
  # -full flavor (#24): the slim image installs tools at runtime, resolving the
  # node toolchain via the github-releases datasource — unauthenticated from
  # shared CI runners that gets rate-limited → "No tool releases found." →
  # every npm lockfile regen died (surfaced as `undefined` artifact errors).
  # -full ships node/npm preinstalled (binarySource=global), no GitHub lookup.
  # Alternative documented fix if we ever go back to slim: GITHUB_COM_TOKEN.
  image: renovate/renovate:43-full@sha256:a56ca46bab7959c99c6f757092240214bc8b5da823d8aaf6b37551038366662a
  # NOT interruptible: a maintenance run should finish, not be cancelled by a
  # newer main pipeline mid-run (which could leave update MRs half-created).
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_ONBOARDING: "false"        # config lives in-repo (.gitlab/renovate.json)
    # Belt-and-braces with the -full image (which defaults to this): never
    # try runtime tool installs — they need github-releases API access.
    RENOVATE_BINARY_SOURCE: "global"
    RENOVATE_REQUIRE_CONFIG: "required"
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'

# ── Weekly ops digest (issue #33 / #16 cadence) ──────────────────────────────
# Piggybacks on the "Weekly base-image rescan" schedule (the one WITHOUT
# RENOVATE_RUN) — no new pipeline schedule needed. Independent of build/scan
# (needs: []) so it always runs & posts; never builds or deploys. Probes prod
# health + summarizes CI / security / dependency signals and posts a Markdown
# digest as a note on a standing issue. One-time owner setup (Settings → CI/CD
# → Variables, both protected):
#   OPS_DIGEST_ISSUE_IID = iid of a standing "Weekly ops digest" issue
#   GL_TOKEN             = api-scoped token that can post issue notes (dedicated Reporter token)
ops_digest:
  stage: maintenance
  image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  needs: []
  interruptible: false
  variables:
    PROD_URL: "https://dlectroflow.dev"
  before_script:
    - apk add --no-cache curl jq coreutils bash
  script:
    - bash scripts/ops-digest.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ── Registry prune (#114, from #113) ─────────────────────────────────────────
# Bounds the `main-*` tag set that the registry cleanup policy keeps FOREVER
# (`name_regex_keep` includes `main-.*`), which is why the registry reached 1,886
# tags / ~116 GiB. GitLab's policy cannot express "keep the newest N matching a
# pattern", so the retention rule lives in scripts/prune-registry.sh: keep the
# newest 10 `main-*` tags by main's git history, plus whatever production is
# actually running, and delete the rest.
#
# THIS JOB DELETES PRODUCTION ARTEFACTS, so read scripts/prune-registry.sh's
# header before changing anything here. Its safety properties (read prod's tag
# from the cluster or delete nothing; assert the tag→commit match rate; page the
# alphabetical tags API to exhaustion) are covered by
# src/lib/registry-prune.test.ts, which also asserts the two settings below.
#
# Runs ONLY on the "Weekly registry prune" schedule (REGISTRY_PRUNE=true) — see
# the schedule list at the top of this file. Never on a merge request, never on
# main, never on a tag.
prune_registry:
  extends: .deploy_base       # helm-kubectl image + $KUBECONFIG perms + agent context
  stage: maintenance          # this is maintenance, not a deploy
  needs: []
  interruptible: false        # a prune should finish, not be cancelled part-way
  variables:
    # Ranking tags needs EVERY commit on main. The runner's default depth of 50
    # would leave most main-* tags looking unmatched — which the script's
    # match-rate assertion correctly turns into a hard abort, so the job would
    # simply never do anything.
    GIT_DEPTH: 0
    # SHIPS AS A DRY RUN (#114). The job prints the plan it would carry out and
    # deletes nothing. Flipping this to "false" is a deliberate decision to be
    # taken AFTER reading a real dry run's output in this job's log — and it
    # needs a credential this job does not have yet:
    #
    # CI_JOB_TOKEN can READ the registry API (verified 2026-07-29: GET
    # registry/repositories and GET .../tags both 200, so the dry run needs
    # nothing extra) but CANNOT delete — DELETE .../tags/<name> returns 403,
    # not 404, even for a tag that does not exist, so authorization fails
    # before the lookup. Enabling deletion therefore also means adding a
    # masked + protected REGISTRY_PRUNE_TOKEN (Maintainer, `api` scope); the
    # script warns if PRUNE_DRY_RUN=false without it.
    PRUNE_DRY_RUN: "true"
  script:
    # The helm-kubectl image carries most of these, but the runner clones in a
    # helper container, so nothing about the job image's toolchain is guaranteed.
    - 'for tool in curl jq git; do command -v "$tool" >/dev/null 2>&1 || apk add --no-cache "$tool"; done'
    - bash scripts/prune-registry.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $REGISTRY_PRUNE == "true"'

# ── Monthly security assessment (#134) ───────────────────────────────────────
# The cadence in docs/quality-audit-prompts.md said "monthly: Duo
# security-assessment.md full run" from the day it was written, and listed
# scheduled pipelines under "Automation gaps". Nothing ran it, and the
# Vulnerability Report reached 70 findings with 8 HIGH that had never been read
# — the Scan Result Policy gates on *new* Critical/High, so the standing
# baseline is never "new" and is invisible by construction.
#
# This job does not perform the assessment (that is a human/agent run of the
# prompt). It files the dated work item the prompt requires, pre-filled with the
# active-vulnerability snapshot — including the split the Vulnerability Report's
# default view hides: how many findings are still detected on `main` versus
# already fixed but never resolved. All 8 of #134's HIGH findings were the
# latter.
#
# Runs ONLY on the "Monthly security assessment" schedule (SECURITY_ASSESSMENT=true)
# — see the schedule list at the top of this file. Never on a merge request
# (it would file one issue per MR), never on main, never on a tag.
#
# One-time owner setup: GL_TOKEN (Settings → CI/CD → Variables, protected) — the
# same api-scoped token ops_digest uses. Unset is the "not configured" case: the
# script previews to the job log and posts nothing, rather than failing.
#
# Behaviour is covered by src/lib/security-assessment.test.ts, which drives the
# real script with curl stubbed and asserts the settings below.
security_assessment:
  stage: maintenance
  image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  needs: []                 # never gated on a build: the point is that it always runs
  interruptible: false      # a maintenance run should finish, not be cancelled mid-post
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - bash scripts/security-assessment.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECURITY_ASSESSMENT == "true"'

# ── Pipeline-failure alert (#147, split out of #146) ──────────────────────────
# Pipeline 2721968532 on `main` failed in `test_app`. `deploy_production` is in a
# LATER stage, so it was **skipped, not failed**: the pipeline's own red tick was
# the only signal that the merge had not deployed. `main` stayed red for 86
# minutes, that merge never reached production, and prod only caught up by
# accident when the next MR merged. It was noticed while auditing environments
# for an unrelated reason.
#
# So this job is keyed on the awkward shape rather than the obvious one. A check
# that waited for `deploy_production` to FAIL would not have caught the incident
# that prompted the issue, because it never ran at all.
#
# It also settles the sharper half of #147: a skipped `deploy_production` is
# otherwise indistinguishable from a docs-only pipeline where skipping is
# correct (#116's fast path). On `main` it never is, and the note says so.
#
# Channel: a note on the standing ops issue — the mechanism `ops_digest` already
# uses to get a message from CI to a human here. That means NO new one-time
# setup: `GL_TOKEN` and `OPS_DIGEST_ISSUE_IID` are already configured, so this
# works the first time `main` goes red rather than the first time somebody
# remembers to wire a webhook. An unwired alert is the bug being fixed.
# Optional: `ALERT_ISSUE_IID` to send it elsewhere, `ALERT_MENTION` (a single
# `@handle`) to have GitLab raise a to-do rather than just an email.
#
# Behaviour is covered by src/lib/pipeline-failure-alert.test.ts, which drives
# both scripts with curl stubbed and asserts the settings below.
alert_pipeline_failure:
  stage: maintenance          # must be AFTER deploy: it reads deploy_production's final status
  image: alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  # No `needs:` key here, deliberately. `when: on_failure` scopes itself to a
  # job's `needs` when it has any, so writing `needs: []` would scope it to an
  # EMPTY set of jobs and this alert would never fire. Without the key it takes
  # stage semantics — "at least one job in an earlier stage failed" — which is
  # exactly the incident shape: a `build`-stage failure skipping a `deploy`-stage
  # job. `dependencies: []` stops that from also downloading every earlier
  # stage's artifacts (the #145 expiry trap) while leaving stage ordering intact.
  dependencies: []
  interruptible: false        # an alert should finish, not be cancelled mid-post
  before_script:
    - apk add --no-cache curl jq bash
  script:
    - bash scripts/alert-pipeline-failure.sh
  rules:
    # Never from a scheduled pipeline. A scheduled rescan never deploys, so it
    # cannot cause the divergence this job exists to catch, and the weekly digest
    # already counts failed `main` pipelines. One blanket guard rather than one
    # per flag, matching deploy_production — it covers RENOVATE_RUN,
    # REGISTRY_PRUNE and SECURITY_ASSESSMENT by construction.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # `main` only. A red merge-request pipeline is already in front of the person
    # who pushed it and cannot make main and production diverge; alerting on those
    # would be the noise that gets the real alert filtered.
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_failure
