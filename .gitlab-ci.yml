# Avoid duplicate pipelines: run a merge-request pipeline for MRs, suppress the
# redundant branch pipeline while an MR is open, and run branch pipelines on main.
# Scheduled pipelines (weekly base-image rescan + Renovate) are allowed explicitly.
# Version tags (vX.Y.Z) also get a pipeline — it builds + publishes the versioned
# release image (see build_image). Without this rule a tag push matches no rule
# and creates no pipeline. Tag pipelines never deploy (deploy jobs are MR/main only).
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - build         # build_app: npm ci + next build (compile)
  - build_image   # build_image: Kaniko assembles the image from build_app's artifacts
  - test          # security scanners (container_scanning needs the built image → after build_image)
  - deploy
  - maintenance   # renovate: dependency/base-image update MRs (Renovate schedule only)

# ── Scheduled pipelines (issue #2, task 4.3 — base-image refresh cadence) ─────
# Two pipeline schedules drive maintenance (create in Settings → CI/CD → Schedules):
#   1. "Weekly base-image rescan"  → no extra variables. Rebuilds the image on the
#      current main and re-runs all scanners so new base/dependency CVEs surface in
#      the Vulnerability Report even when no code changed. Does NOT deploy.
#   2. "Weekly Renovate"           → variable RENOVATE_RUN=true. Runs ONLY the
#      renovate job, which opens update MRs (npm deps + Docker base). Each MR then
#      runs the full scanner suite and is gated by review (see renovate.json).
# The RENOVATE_RUN flag keeps the two schedules from stepping on each other.

variables:
  IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  AGENT_CONTEXT: "gl-demo-ultimate-dtop/domi-oss/dlectroflow:dlectroflow"
  # ── Artifact/cache transfer speed ────────────────────────────────────────
  # Fastzip + fast compression cuts upload/download time for the sizeable
  # ci-dist/ artifact and the .next/.npm caches at a small size cost.
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  CACHE_COMPRESSION_LEVEL: "fast"
  # ── Security Scanners ────────────────────────────────────────────────────
  # Container Scanning: target the image assembled by build_image
  CS_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  # SAST: skip generated/vendored paths
  SAST_EXCLUDED_PATHS: "node_modules, .next, ci-dist, coverage, prisma/migrations"
  # Advanced SAST: cross-file taint/dataflow analysis (Ultimate). Adds the
  # gitlab-advanced-sast job (rules override below). Honors SAST_EXCLUDED_PATHS
  # so ci-dist/ stays excluded, and dedupes findings against semgrep-sast.
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  # Dependency Scanning: lock-file only (no node_modules needed)
  DS_EXCLUDED_PATHS: "node_modules"
  # Secret Detection: exclude the generated Next.js build output staged for
  # Kaniko. ci-dist/ is gitignored (never committed), but excluding it here
  # keeps any future artifact-scanning from re-raising false positives such as
  # the PKCS8 "key" that is really a bundled `jose` library dist chunk.
  SECRET_DETECTION_EXCLUDED_PATHS: "ci-dist, .next, node_modules"

# ── GitLab security scanners ────────────────────────────────────────────────
# Canonical Jobs/* templates (the Security/* paths are the older alias). These
# default to *branch* pipelines; we override each job's rules below so they run
# in merge-request + main pipelines — that's what populates the MR security
# widget and the Vulnerability Report.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

# Move the scanners off their branch-only default and onto MR + main pipelines.
# Also run them on the weekly rescan schedule (to re-detect drifting base CVEs),
# but never on the Renovate schedule (RENOVATE_RUN=true) — that runs only renovate.
#
# allow_failure is set per-rule: on MR pipelines the scanners are REQUIRED
# (allow_failure: false) so a scanner that can't run blocks the merge — closing
# the automerge fail-open where a broken scanner would let a Renovate MR through.
# On main we leave the template default (allow_failure: true) so a scanner flake
# can't block a production deploy. (Blocking on *findings* — new Critical/High —
# is the job of the Scan Result Policy, task 4.2, not job exit status.)
.scanner_rules: &scanner_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    allow_failure: false
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# Source-only scanners get needs: [] so they start at pipeline start, in
# parallel with build_app, instead of waiting behind both build stages.
# interruptible: true lets a newer pipeline on the same ref cancel them.
semgrep-sast:
  needs: []          # scans source only — no build output required
  interruptible: true
  rules: *scanner_rules

# Advanced SAST ships as its own job and (like the others) defaults to
# branch-only — give it the same overrides so it runs in MR + main pipelines
# and populates the MR security widget.
gitlab-advanced-sast:
  needs: []          # scans source only — no build output required
  interruptible: true
  rules: *scanner_rules

gemnasium-dependency_scanning:
  needs: []          # scans package-lock.json only — no build output required
  interruptible: true
  rules: *scanner_rules

secret_detection:
  needs: []          # scans git history only — no build output required
  interruptible: true
  rules: *scanner_rules

container_scanning:
  # Scans the image assembled by build_image (the build job was split into
  # build_app + build_image). needs it so the image exists before scanning.
  needs: ["build_image"]
  interruptible: true
  rules: *scanner_rules

# ── Build: compile (build_app) then assemble image (build_image) ─────────────
# Runs npm ci + next build in a standard Node runner with GitLab file cache.
# .next/cache is preserved between runs for Next.js incremental compilation;
# .npm/ keeps npm's tarball cache so npm ci reinstalls from disk, not network.
build_app:
  stage: build
  # alpine (musl) so npm ci + next build produce musl-matched native binaries
  # (esp. the Prisma engine) that the alpine runtime image can execute.
  image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
  interruptible: true  # superseded pipelines on the same ref cancel this job
  before_script:
    - apk add --no-cache openssl   # Prisma engine needs libssl; targets come from schema.prisma
  script:
    # --cache .npm keeps tarballs in the CI cache; --prefer-offline uses them
    # without a registry round-trip; --no-audit/--no-fund skip extra requests.
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run build
    # Stage the build output under ci-dist/ (NOT .next/): .dockerignore excludes
    # .next, and Kaniko honors it, so a .next/* artifact would be stripped from
    # the image context. ci-dist/ is not ignored, so it survives into Kaniko.
    - mkdir -p ci-dist
    - cp -r .next/standalone ci-dist/standalone
    - cp -r .next/static ci-dist/static
  cache:
    key:
      files:
        - package-lock.json
    # npm ci deletes node_modules/ before installing, so caching it is pure
    # up/download overhead — cache npm's tarball store (.npm/) and Next's
    # incremental build cache (.next/cache/) instead.
    paths:
      - .npm/
      - .next/cache/
  artifacts:
    # Pass only the pre-built output to build_image (staged outside .next/).
    paths:
      - ci-dist/
      - public/
      - prisma/
      - prisma.config.ts
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: compile so build_image can assemble the release image.
    - if: '$CI_COMMIT_TAG'

# ── Test gate (#21 P3): tsc + eslint + vitest ahead of image/deploy ──────────
# Next 16's `next build` neither runs tests nor lints, so before this job a red
# suite (or lint) could ride any compiling main commit straight into
# deploy_production. Gating is double: build_image `needs` this job, and
# deploy_production is stage-scheduled behind the build stage on main.
test_app:
  stage: build
  image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
  interruptible: true
  needs: []          # starts at pipeline start, in parallel with build_app
  # Real Postgres for the *.integration.test.ts files (they exercise actual
  # queries — e.g. workspace scoping — and skipping them in CI would gate on
  # less than the local suite runs).
  services:
    - postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
  variables:
    POSTGRES_USER: dlectroflow
    POSTGRES_PASSWORD: ci-test-only
    POSTGRES_DB: dlectroflow_test
    # Compose from the POSTGRES_* vars above rather than embedding the literal
    # password (avoids a "password in URL" secret-detection hit; DRY).
    DATABASE_URL: "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?schema=public"
  before_script:
    - apk add --no-cache openssl   # Prisma engine libssl (postinstall runs prisma generate)
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx tsc --noEmit
    # Errors fail the gate; the react-hooks compiler-era rules are warn-level
    # pending the #23 burn-down, so their findings stay visible but don't block.
    - npm run lint
    - npx prisma migrate deploy   # schema for the integration tests' service DB
    - npm run test
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    # pull-only: build_app owns the cache upload (incl. .next/cache/); a push
    # from here would overwrite that zip with one missing the Next build cache.
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: gate the release image on a green suite too (build_image needs this).
    - if: '$CI_COMMIT_TAG'

# ── E2E gate (#37): Playwright smoke suite against a real Postgres, real
# `next build` + `next start` ─────────────────────────────────────────────────
# The Playwright image is Debian/glibc (required for the bundled browsers) and
# ships Node, so no apk/openssl before_script is needed here (unlike test_app's
# alpine image) — npm ci's postinstall (`prisma generate`) downloads the
# Debian-matched engine directly. Auth/session boot-guard env vars are supplied
# by playwright.config.ts's webServer.env, so this job only needs the
# Postgres/DB vars, same as test_app.
e2e_test:
  stage: build
  image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
  interruptible: true
  needs: []          # starts at pipeline start, in parallel with build_app
  services:
    - postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
  variables:
    POSTGRES_USER: dlectroflow
    POSTGRES_PASSWORD: ci-test-only
    POSTGRES_DB: dlectroflow_test
    # Compose from the POSTGRES_* vars above rather than embedding the literal
    # password (avoids a "password in URL" secret-detection hit; DRY).
    DATABASE_URL: "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB?schema=public"
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx prisma migrate deploy   # schema for the smoke suite's service DB
    - npm run build
    - npx playwright test
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 1 week
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    # pull-only: build_app owns the cache upload (incl. .next/cache/); a push
    # from here would overwrite that zip with one missing the Next build cache.
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: build_image publishes the release image on tags and now
    # needs e2e_test, so the gate MUST exist on tag pipelines too (mirrors
    # test_app) — otherwise build_image is skipped and no release image ships.
    - if: '$CI_COMMIT_TAG'

# Assembles the final image from build_app's artifacts using Dockerfile.ci.
# Kaniko does no compilation here — COPY + npm install prisma only — so the
# remaining layers are very stable and almost always cache hits.
build_image:
  stage: build_image
  interruptible: true  # superseded pipelines on the same ref cancel this job
  needs:
    - job: build_app
      artifacts: true
    # Test gate: no image (and thus no review/prod deploy) from a red suite.
    - job: test_app
      artifacts: false
    # E2E gate (#37): no image from a red Playwright smoke suite either.
    - job: e2e_test
      artifacts: false
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    # On main, ALSO push a stable main-<short-sha> tag. deploy_production pulls
    # this tag, and the container-registry cleanup policy's keep-regex (main-.*)
    # protects it permanently — so cleanup can never delete the image prod runs.
    # (Protecting main-* only helps because prod pulls it: deleting an untagged
    # SHA would 404 even though the same digest survives under another tag.)
    # Review/MR pipelines push only the ephemeral SHA tag, which cleanup reaps.
    - |
      DESTS="--destination $IMAGE"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DESTS="$DESTS --destination $CI_REGISTRY_IMAGE:main-$CI_COMMIT_SHORT_SHA"
      fi
      # On a version tag (vX.Y.Z), publish the release image under its version
      # and move :latest to it — the tag pipeline's whole purpose (issue #12 §5).
      # No deploy runs on a tag (deploy jobs are MR/main only), so this only
      # publishes; the human rolls it out separately if/when desired.
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE:latest"
      fi
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile.ci"
        $DESTS
        --cache=true
        --cache-repo "$CI_REGISTRY_IMAGE/cache"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Version tag: assemble + push the versioned release image and :latest.
    - if: '$CI_COMMIT_TAG'

# ── Deploy ───────────────────────────────────────────────────────────────────
.deploy_base:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3.19.1@sha256:d02d8d02a24d67e4851503cc443e7eb2358383c9c052f699c262409cd05dae55   # bundles helm + kubectl
    entrypoint: [""]
  before_script:
    - chmod 600 "$KUBECONFIG"   # tighten perms on the runner-generated kubeconfig (silences Helm's group-readable warning)
    - kubectl config use-context "$AGENT_CONTEXT"

deploy_review:
  extends: .deploy_base
  # Deploy as soon as the image is pushed — the scanners are allow_failure: true
  # and never gate the review deploy, so waiting on the test stage is pure delay.
  # (deploy_production intentionally stays stage-scheduled so scan results land
  # before a prod rollout.)
  needs: ["build_image"]
  # Serialize helm per review env: deploy jobs aren't interruptible, so a
  # quick follow-up push otherwise races the previous pipeline's still-running
  # helm op on the same release → "another operation is in progress" (hit on
  # !46). Same group as stop_review so a deploy can't race the teardown either.
  resource_group: review/$CI_MERGE_REQUEST_IID
  secrets:
    ANTHROPIC_API_KEY:
      gitlab_secrets_manager: { name: ANTHROPIC_API_KEY, source: group/gl-demo-ultimate-dtop }
      file: false
    POSTGRES_PASSWORD:
      gitlab_secrets_manager: { name: POSTGRES_PASSWORD, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN_USER:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN_USER, source: group/gl-demo-ultimate-dtop }
      file: false
  script:
    # Per-deploy random session-signing key for the ephemeral review app — never
    # committed. Rotating it each deploy only resets guest cookies (review holds
    # no real data), and avoids shipping a known signing key in the repo.
    - AUTH_SESSION_SECRET=$(cat /proc/sys/kernel/random/uuid /proc/sys/kernel/random/uuid | tr -cd 'a-fA-F0-9')
    # Phase 2 — dummy per-deploy guest IP-hash salt so the prod-mode boot guard
    # starts in the ephemeral review app (holds no real guest data).
    - GUEST_IP_HASH_SALT_REVIEW=$(cat /proc/sys/kernel/random/uuid /proc/sys/kernel/random/uuid | tr -cd 'a-fA-F0-9')
    # #21 P2 — dummy per-deploy AES-256-GCM key so the boot guard starts in the
    # ephemeral review app (holds no real OAuth tokens). od/tr are busybox
    # built-ins; avoid openssl (not in this Alpine deploy image).
    - TOKEN_ENC_KEY=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
    - helm upgrade --install "dlectroflow-mr-$CI_MERGE_REQUEST_IID" charts/dlectroflow
        --namespace "dlectroflow-mr-$CI_MERGE_REQUEST_IID" --create-namespace
        --set env=review --set spot=true --set postgres.persistent=false
        --set replicas=1
        --set-string image.tag="$CI_COMMIT_SHA"
        --set-string host="mr-$CI_MERGE_REQUEST_IID.35-246-93-255.sslip.io"
        --set-string secrets.postgresPassword="$POSTGRES_PASSWORD"
        --set-string secrets.anthropicApiKey="$ANTHROPIC_API_KEY"
        --set-string auth.ownerAllowlist="13595692"
        --set-string secrets.authSessionSecret="$AUTH_SESSION_SECRET"
        --set-string secrets.gitlabOauthClientId="review-unused"
        --set-string secrets.gitlabOauthClientSecret="review-unused"
        --set-string secrets.guestIpHashSalt="$GUEST_IP_HASH_SALT_REVIEW"
        --set-string secrets.tokenEncKey="$TOKEN_ENC_KEY"
        --set-string registry.username="$GITLAB_DEPLOY_TOKEN_USER"
        --set-string registry.password="$GITLAB_DEPLOY_TOKEN"
        --set resources.app.cpu=250m
        --atomic --timeout 10m
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: https://mr-$CI_MERGE_REQUEST_IID.35-246-93-255.sslip.io
    on_stop: stop_review
    auto_stop_in: 2 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stop_review:
  extends: .deploy_base
  resource_group: review/$CI_MERGE_REQUEST_IID
  script:
    - helm uninstall "dlectroflow-mr-$CI_MERGE_REQUEST_IID" --namespace "dlectroflow-mr-$CI_MERGE_REQUEST_IID" || true
    - kubectl delete namespace "dlectroflow-mr-$CI_MERGE_REQUEST_IID" --ignore-not-found
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true

deploy_production:
  extends: .deploy_base
  # Serialize prod helm ops (rapid successive merges to main would otherwise
  # race each other the same way review deploys can).
  resource_group: production
  secrets:
    ANTHROPIC_API_KEY:
      gitlab_secrets_manager: { name: ANTHROPIC_API_KEY, source: group/gl-demo-ultimate-dtop }
      file: false
    POSTGRES_PASSWORD:
      gitlab_secrets_manager: { name: POSTGRES_PASSWORD, source: group/gl-demo-ultimate-dtop }
      file: false
    GOOGLE_CLIENT_ID:
      gitlab_secrets_manager: { name: GOOGLE_CLIENT_ID, source: group/gl-demo-ultimate-dtop }
      file: false
    GOOGLE_CLIENT_SECRET:
      gitlab_secrets_manager: { name: GOOGLE_CLIENT_SECRET, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN, source: group/gl-demo-ultimate-dtop }
      file: false
    GITLAB_DEPLOY_TOKEN_USER:
      gitlab_secrets_manager: { name: GITLAB_DEPLOY_TOKEN_USER, source: group/gl-demo-ultimate-dtop }
      file: false
  script:
    # image.tag is the protected main-<short-sha> tag (kept forever by the
    # registry cleanup policy), never the ephemeral bare SHA which cleanup reaps.
    - helm upgrade --install dlectroflow charts/dlectroflow
        --namespace dlectroflow-prod --create-namespace
        --set env=production --set postgres.persistent=true
        --set-string image.tag="main-$CI_COMMIT_SHORT_SHA"
        --set-string host="dlectroflow.dlectronique.dev"
        --set-string secrets.postgresPassword="$POSTGRES_PASSWORD"
        --set-string secrets.anthropicApiKey="$ANTHROPIC_API_KEY"
        --set-string secrets.googleClientId="$GOOGLE_CLIENT_ID"
        --set-string secrets.googleClientSecret="$GOOGLE_CLIENT_SECRET"
        --set-string auth.ownerAllowlist="13595692"
        --set-string secrets.authSessionSecret="$AUTH_SESSION_SECRET"
        --set-string secrets.gitlabOauthClientId="$GITLAB_OAUTH_CLIENT_ID"
        --set-string secrets.gitlabOauthClientSecret="$GITLAB_OAUTH_CLIENT_SECRET"
        --set-string secrets.guestIpHashSalt="$GUEST_IP_HASH_SALT"
        --set-string secrets.tokenEncKey="$TOKEN_ENC_KEY"
        --set-string registry.username="$GITLAB_DEPLOY_TOKEN_USER"
        --set-string registry.password="$GITLAB_DEPLOY_TOKEN"
        --set backup.enabled=true
        --set-string backup.gcsBucket="dlectroflow-db-backups-dtop-1bf3a85b"
        --set-string backup.gcpServiceAccount="dlectroflow-backup@dtop-1bf3a85b.iam.gserviceaccount.com"
        --atomic --timeout 10m
  environment:
    name: production
    url: https://dlectroflow.dlectronique.dev
  rules:
    # Never deploy from a scheduled pipeline (the weekly rescan rebuilds + scans
    # only; base bumps reach prod via a Renovate MR merged to main → push pipeline).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Renovate: automated dependency + base-image update MRs ────────────────────
# Self-hosted Renovate, run by the "Weekly Renovate" schedule (RENOVATE_RUN=true).
# Behaviour is configured in renovate.json (npm deps + Docker base, pinned digests,
# automerge for patch/minor/digest once the pipeline — incl. scanners — is green).
# Requires a masked CI/CD variable RENOVATE_TOKEN with `api` scope and Maintainer
# role (merge rights for automerge). Use a Personal Access Token or a service-account
# token — NOT a project access token (Renovate's GitLab platform init calls
# GET /api/v4/user, which a project-access-token bot user cannot authenticate).
# The project variable is auto-injected into this job's environment; do NOT re-map
# it as `RENOVATE_TOKEN: "$RENOVATE_TOKEN"` — that self-reference resolves to empty
# and shadows the real value (Renovate then sees no token → 401 unauthenticated).
renovate:
  stage: maintenance
  # Digest-pinned (supply-chain): the major tag is a moving target. Renovate's own
  # gitlabci manager (docker:pinDigests in renovate.json) keeps this digest fresh.
  # -full flavor (#24): the slim image installs tools at runtime, resolving the
  # node toolchain via the github-releases datasource — unauthenticated from
  # shared CI runners that gets rate-limited → "No tool releases found." →
  # every npm lockfile regen died (surfaced as `undefined` artifact errors).
  # -full ships node/npm preinstalled (binarySource=global), no GitHub lookup.
  # Alternative documented fix if we ever go back to slim: GITHUB_COM_TOKEN.
  image: renovate/renovate:43-full@sha256:efd61b2e1956643e27b2355c36830a46f60cbb958d0939bd65b70351b17444e3
  # NOT interruptible: a maintenance run should finish, not be cancelled by a
  # newer main pipeline mid-run (which could leave update MRs half-created).
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_ONBOARDING: "false"        # config lives in-repo (renovate.json)
    # Belt-and-braces with the -full image (which defaults to this): never
    # try runtime tool installs — they need github-releases API access.
    RENOVATE_BINARY_SOURCE: "global"
    RENOVATE_REQUIRE_CONFIG: "required"
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'
