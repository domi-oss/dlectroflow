services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dlectroflow
      POSTGRES_PASSWORD: dlectroflow
      POSTGRES_DB: dlectroflow
    ports:
      - "5432:5432"
    volumes:
      - dlectroflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlectroflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dlectroflow_pgdata:
