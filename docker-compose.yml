services:
  db:
    image: postgres:16@sha256:17e67d7b9890c99b055ba1e0d5c5be4ec27c9d3a72bda32db24a5e5d8a85af0c
    restart: unless-stopped
    environment:
      POSTGRES_USER: dlectroflow
      POSTGRES_PASSWORD: dlectroflow
      POSTGRES_DB: dlectroflow
    ports:
      - "5432:5432"
    volumes:
      - dlectroflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlectroflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dlectroflow_pgdata:
