image:
  repository: registry.gitlab.com/gl-demo-ultimate-dtop/domi-oss/dlectroflow
  tag: ""
  pullPolicy: IfNotPresent

env: production        # review | production
host: dlectroflow.dev
# Old hostnames that should 301-redirect to `host`. Empty by default (review
# apps never redirect); production sets it via CI (--set legacyHosts[0]=...).
# Powers the zero-downtime domain migration (#54): legacy hosts are added to the
# PRIMARY ingress (multi-SAN TLS cert) and traffic is forwarded to the app pod,
# which issues a path-preserving 301 via Next.js redirects() (next.config.ts).
# NOTE: cert-manager's HTTP-01 self-check needs every legacy host in the
# cert-manager hostAlias too (GKE hairpin quirk, see docs/deploy-runbook.md §4).
legacyHosts: []
replicas: 2            # review apps pinned to 1 via CI (no HA need on spot)
spot: false            # true for review apps (nodeSelector onto gke-spot nodes)

# Add the GKE spot taint toleration (cloud.google.com/gke-spot=true:NoSchedule)
# to the app + postgres pods. Needed ONLY on GKE STANDARD, where spot node pools
# carry that taint and an un-tolerated pod stays Pending. LEAVE OFF on GKE
# Autopilot — this repo's deploy target — where the control plane AUTO-INJECTS
# this toleration for any pod that nodeSelects gke-spot, so setting it here is
# redundant. Only rendered together with `spot: true`. (#15)
spotToleration: false

# Review apps only (#25): the shared demo workspace that gets pre-seeded
# (prisma/seed.ts) and that the proxy seats every guest into, so reviewers land
# on populated content. Only rendered when env=review; never used in production.
reviewDemoWorkspaceId: review-demo

# Per-container CPU/memory. These are the REQUESTS (the guaranteed floor). The
# MEMORY limit is always pinned to the request (memory is incompressible — an
# unbounded container can OOM the node). The CPU limit is handled by the
# dlectroflow.resources helper (_helpers.tpl): it is DROPPED in production so the
# Next.js app + Prisma migrate initContainer aren't throttled to their request
# when the node has spare CPU (that throttling also slowed `helm --wait` /
# deploy_review), and KEPT in review, where the namespace ResourceQuota
# (resourcequota.yaml) makes limits.cpu mandatory on every container. (#15)
resources:
  app:
    cpu: 500m
    memory: 512Mi
  postgres:
    cpu: 250m
    memory: 512Mi

postgres:
  # persistent is NOT safely togglable on an existing release: it drives the
  # StatefulSet's volumeClaimTemplates, and once a StatefulSet exists that field
  # is immutable — flipping true<->false makes `helm upgrade` fail with
  # "Forbidden: updates to statefulset spec for fields other than ...". Pick it
  # at first install per env (prod=true, review=false) and never change it in
  # place; recreate the release (uninstall/install) if it must change.
  persistent: true     # false for review (emptyDir)
  storageSize: 8Gi
  # Pin the postgres MINOR (not the floating `16` tag) + a matching digest so
  # nodes can't drift across minors under pullPolicy: IfNotPresent. Digest is
  # authoritative for the pull; the human-readable minor is kept in sync with it.
  # In-major (16.x -> 16.y) bumps are binary-compatible and need no dump/restore;
  # a cross-major bump (17.x) needs a dump/restore and so is deliberately NOT
  # auto-merged (majors always get a manual-review MR). Now tracked by the
  # customManager in .gitlab/renovate.json via the "# renovate:" annotation below, which
  # bumps this tag+digest — and the backup dumpImage that defaults to it. (#15)
  # renovate: datasource=docker depName=postgres versioning=docker
  image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20

tls:
  clusterIssuer: letsencrypt-prod

# Optional NetworkPolicy that restricts Postgres :5432 ingress to the app pods
# (app Deployment + migrate/seed init + backup/purge jobs all carry the
# app.kubernetes.io/name=dlectroflow label). Off by default: it is a no-op on
# clusters without a NetworkPolicy controller, and on GKE Dataplane V2 it should
# be smoke-tested on a review app before enabling in prod. Probes are exec (not
# network), so the postgres liveness/readiness checks are unaffected.
networkPolicy:
  enabled: false

# Rendered into a dockerconfigjson pull secret (private GitLab registry).
registry:
  server: registry.gitlab.com
  username: ""
  password: ""

# Injected by CI from GitLab Secrets Manager / CI variables; never committed.
secrets:
  postgresPassword: ""
  anthropicApiKey: ""
  googleClientId: ""
  googleClientSecret: ""
  resendApiKey: ""
  roundupFromEmail: ""
  # #135 — LLM_API_KEY, the credential for an openai-compatible endpoint that
  # needs one (a local Ollama/LM Studio does not). Kept here rather than under
  # `llm:` below because it is a real secret; the adapter falls back to
  # "not-needed" when unset. Only rendered into the Secret when non-empty.
  llmApiKey: ""
  # Owner auth — required in ALL envs (the prod boot guard refuses to start
  # without these; review apps use dummy-but-valid values passed by CI).
  authSessionSecret: ""
  gitlabOauthClientId: ""
  gitlabOauthClientSecret: ""
  # Phase 2 — salts the guest IP hash (boot guard requires >=16 chars in prod).
  # Prod: masked+protected CI var GUEST_IP_HASH_SALT. Review: dummy generated by CI.
  guestIpHashSalt: ""
  # #21 P2 — AES-256-GCM key for OAuth token columns (64 hex chars). Boot guard
  # requires it in all envs. Prod: masked+hidden+protected CI var TOKEN_ENC_KEY.
  # Review: dummy generated per-deploy by CI.
  tokenEncKey: ""
  # Backblaze B2 application key for the backup CronJob's second destination.
  # Read by that job only, never by the app, and rendered into the Secret only
  # when backup.b2.enabled. Prod: BACKUP_B2_KEY_ID (masked) and
  # BACKUP_B2_APP_KEY (masked+hidden). Empty here rather than absent so the
  # surface is discoverable without reading .gitlab-ci.yml — and backup.yaml
  # refuses to render if B2 is enabled while either is still empty.
  b2KeyId: ""
  b2AppKey: ""

# Owner auth config (non-secret). ownerAllowlist = comma-separated allowed
# identities (GitLab numeric user id for the gitlab provider).
auth:
  provider: gitlab
  ownerAllowlist: ""

# ── Optional app tuning (#135) ───────────────────────────────────────────────
# The knobs the Compose self-host path has always exposed via
# .env.prod.example. Before #135 they had no chart equivalent, so this instance
# could not switch LLM provider or change a guest quota without a chart edit.
# src/lib/env-drift.test.ts now diffs the two surfaces and fails on any
# undeclared divergence, so a key added to one must be added to the other or
# recorded in CONFIG_SURFACE_ALLOWLIST with a reason.
#
# EVERY VALUE HERE DEFAULTS TO "" MEANING "LEAVE UNSET — the code default
# applies". They are deliberately not pre-filled with the code's own defaults:
# a chart that repeats a default silently pins it, so the next change to
# src/lib/constants.ts would reach the Compose stack and not the cluster, which
# is the same class of drift #135 exists to stop. The effective default is noted
# per key instead, so an operator can see it without reading source.
#
# secret.yaml renders each key ONLY when non-empty — "" would be a *set but
# empty* env var, which several readers treat very differently from unset (see
# the comment there). Override with --set / --set-string, as CI does for the
# secrets below.
llm:
  provider: "" # LLM_PROVIDER — default: anthropic. Other value: openai-compatible
  baseUrl: "" # LLM_BASE_URL — no default; REQUIRED when provider=openai-compatible
  model: "" # LLM_MODEL — no default; REQUIRED when provider=openai-compatible
  # LLM_SUPPORTS_TOOLS — default: true. Set "false" for a model with no native
  # tool calling (falls back to JSON-in-text). A STRING, not a bool: see the
  # `ne (toString …)` note in secret.yaml for why either form still renders.
  supportsTools: ""
  ownerBreakdownModel: "" # OWNER_BREAKDOWN_MODEL — default: claude-sonnet-4-6 (anthropic only)
  guestBreakdownModel: "" # GUEST_BREAKDOWN_MODEL — default: claude-haiku-4-5 (anthropic only)
  # LLM_OWNER_MODEL / LLM_GUEST_MODEL — the openai-compatible counterparts to
  # the two breakdown models above (which only apply to `anthropic`). Each falls
  # back to `model` when unset (#96 — a member is not a guest).
  ownerModel: ""
  guestModel: ""

google:
  # GOOGLE_TASKS_LIST_NAME — default: reclaim. The Google Tasks list confirmed
  # steps are written to; Reclaim.ai only auto-schedules from its own list.
  tasksListName: ""

scheduling:
  # SCHEDULING_SYNTAX — default: detected from the list name (a list matching
  # "reclaim" gets Reclaim's parenthetical parameters, anything else a clean
  # title plus Google Tasks' native due date). "reclaim" or "plain" to override.
  syntax: ""
  # SCHEDULING_TIMEZONE — default: Europe/London. An IANA zone; the windows the
  # scheduler treats as working hours are computed in it.
  timezone: ""

# Guests are unauthenticated visitors in a throwaway sandbox. These caps are
# what stop a public instance running up the model bill.
guest:
  aiQuotaPerWindow: "" # GUEST_AI_QUOTA_PER_WINDOW — default: 5
  aiWindowHours: "" # GUEST_AI_WINDOW_HOURS — default: 24
  globalDailyCap: "" # GUEST_GLOBAL_DAILY_GUEST_CAP — default: 10
  sandboxTtlHours: "" # GUEST_SANDBOX_TTL_HOURS — default: 24

user:
  # USER_AI_WINDOW_HOURS — default: 720 (30 days). The rolling window a
  # signed-in account's AI usage is measured over, sliding from that person's
  # first breakdown.
  aiWindowHours: ""

# The focus timer's music. Ten CC0 tracks ship inside the image (one per
# open-lofi category); the full 166-track set is too large for a container image
# and is read from an object store at run time instead.
focus:
  # FOCUS_CATALOG_ORIGIN — no default. The directory holding the extracted
  # openlofi.zip: the mp3s plus the catalog.json manifest beside them, flat, one
  # path segment each. The manifest is NOT inside the zip — that archive is 166
  # .mp3 files and nothing else — so fetch catalog.json separately from
  # raw.githubusercontent.com/btahir/open-lofi/main/catalog.json. Any plain HTTP
  # file server does, provided it allows unauthenticated reads (the app has no
  # credential to offer it) and honours Range.
  #
  # The app proxies the audio rather than linking to it, so this URL never
  # reaches a browser and any credential the store needs stays server-side —
  # next.config.ts keeps `default-src 'self'` with no `media-src`, which is what
  # makes third-party audio impossible during a focus session.
  #
  # Unset, the player uses the bundled ten. The timer is never silent for want
  # of this value.
  #
  # Setting it also turns on the per-category playlists in Settings (#70), with
  # nothing else to configure: a category is offered once the catalog gives it
  # more than one track. With only the bundled ten — one per category — there is
  # nothing to offer, so that part of the picker is absent rather than greyed out.
  catalogOrigin: ""

# Daily logical Postgres backup → GCS (prod only; see templates/backup.yaml).
# Disabled by default so review apps and `helm template` stay clean; CI turns it
# on for prod with the bucket + GSA below. Retention is the bucket lifecycle.
backup:
  enabled: false
  schedule: "0 2 * * *"          # 02:00 UTC daily
  gcsBucket: ""                  # bucket name, no gs:// prefix
  gcpServiceAccount: ""          # GSA email bound via Workload Identity
  serviceAccountName: dlectroflow-backup
  dumpImage: ""                        # defaults to postgres.image (keeps pg_dump matched to the server major, and inherits its Renovate tracking); override only for a different version
  # `slim` is a rolling tag, so Renovate tracks the DIGEST here (the customManager
  # in .gitlab/renovate.json bumps it as google/cloud-sdk:slim is rebuilt). (#15)
  # renovate: datasource=docker depName=google/cloud-sdk
  uploadImage: google/cloud-sdk:slim@sha256:cb08e90df56365a0a0b68e019ca06f90174bc064c4b0a5edfc3a5cf4415b5ec0

  # Second backup destination, written ALONGSIDE GCS rather than instead of it.
  # The GCS bucket sits in the same cloud project as the cluster it backs up, so
  # today a single deleted project, revoked credential or lapsed billing account
  # takes the database and every copy of it together. A second provider is the
  # standard answer (3-2-1: one copy off the primary platform), and restoring a
  # database is the one recovery path with no alternative — the image rebuilds
  # from source, the data does not.
  #
  # This is additive on purpose. GCS uploads keylessly via Workload Identity; B2
  # has no equivalent, so enabling this puts a long-lived credential in the
  # cluster. Keeping both means that credential can be revoked at any moment
  # without losing the backup, and a B2 outage cannot take the backup with it.
  # Scope the B2 application key to this bucket, Write Only, restricted to the
  # `pg/` prefix. Verified against a real key: it can upload, and is denied both
  # downloading a dump and listing anything outside pg/ — so a cluster
  # compromise cannot read backups out, destroy them, or reach the other
  # prefixes in the bucket. No listFiles needed; see backup.yaml for why.
  b2:
    enabled: false
    bucket: ""                     # B2 bucket name, no b2: prefix
    prefix: "pg"                   # path within the bucket; matches the GCS layout
    # renovate: datasource=docker depName=rclone/rclone
    image: rclone/rclone:1.75@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548

# Daily purge of expired guest workspaces + stale guest counters (#21; prod
# only; see templates/purge-cronjob.yaml). Enabled by default — unlike backup,
# this needs no external infra (just DATABASE_URL, already in every env), but
# the prod-only gate still keeps review apps' ephemeral DB out of scope.
purge:
  enabled: true
  schedule: "30 3 * * *"          # 03:30 UTC daily, after the 02:00 DB backup
