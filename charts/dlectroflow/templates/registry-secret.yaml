apiVersion: v1
kind: Secret
metadata:
  name: dlectroflow-registry
  labels:
    {{- include "dlectroflow.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  # Build the docker config via dict|toJson so a password containing " or \
  # is JSON-escaped correctly (a hand-rolled printf produced invalid JSON for
  # those characters, breaking the pull secret).
  .dockerconfigjson: {{ dict "auths" (dict .Values.registry.server (dict "username" .Values.registry.username "password" .Values.registry.password "auth" (printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc))) | toJson | b64enc }}
