apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dlectroflow
  labels:
    {{- include "dlectroflow.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.host }}
      secretName: dlectroflow-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dlectroflow
                port:
                  number: 80
