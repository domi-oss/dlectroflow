apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dlectroflow
  labels:
    {{- include "dlectroflow.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}

    # ── HTTPS enforcement ──────────────────────────────────────────────────
    # Redirect all HTTP traffic to HTTPS at the ingress layer (belt-and-suspenders
    # with the HSTS header set by the application).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # ── Request size limit ─────────────────────────────────────────────────
    # Cap incoming request bodies at 2 MB. The AI breakdown endpoint validates
    # at 10 000 chars in application code; this is the infrastructure backstop.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"

    # ── Rate limiting ──────────────────────────────────────────────────────
    # Limit each source IP to 20 requests/second and 20 concurrent connections.
    # Protects the Claude Opus endpoint from abuse on unauthenticated review apps.
    # Complies with OWASP ASVS V13.2.6 (API rate limiting).
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # ── Security response headers (ingress layer) ──────────────────────────
    # Belt-and-suspenders: also set by next.config.ts, but enforced here even
    # if the application fails to start or returns an error page.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.host }}
      secretName: dlectroflow-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dlectroflow
                port:
                  number: 80
