apiVersion: apps/v1
kind: Deployment
metadata:
  name: dlectroflow
  labels:
    {{- include "dlectroflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "dlectroflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the Secret changes. Env is injected via envFrom:secretRef,
        # which K8s reads only at container start — a Secret-only change on a
        # same-image-tag deploy would otherwise leave running pods with stale env
        # (e.g. rotated OAuth client id/secret never taking effect until a manual
        # `kubectl rollout restart`). Hashing secret.yaml changes the pod template
        # whenever the rendered Secret changes, forcing a rollout.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
      labels:
        {{- include "dlectroflow.labels" . | nindent 8 }}
    spec:
      {{- if .Values.spot }}
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      {{- if .Values.spotToleration }}
      # GKE STANDARD only — Autopilot injects this toleration automatically for
      # any pod that nodeSelects gke-spot, so it stays OFF there (see values.yaml).
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      {{- end }}
      {{- end }}
      # Soft spread: bias replicas onto different nodes so a single node
      # failure can't take out every pod at once (the PDB only covers
      # voluntary evictions). ScheduleAnyway never blocks scheduling and
      # never forces Autopilot to provision an extra node — best-effort only.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "dlectroflow.selectorLabels" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: dlectroflow-registry
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.postgres.image }}"
          command:
            - sh
            - -c
            - until pg_isready -h dlectroflow-postgres -U dlectroflow; do echo waiting for db; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Resources via the shared helper: keeps a CPU limit in review (the
          # ResourceQuota requires limits.cpu on every container, initContainers
          # included, or the pod is rejected) and drops it in prod to avoid
          # throttling. Memory limit is always set. (#15)
          resources:
            {{- include "dlectroflow.resources" (dict "cpu" "50m" "memory" "64Mi" "env" .Values.env) | nindent 12 }}
        # DB migrations run here, per-pod, before the app container starts.
        # KNOWN RACE (#15, tracked as #18/#20): with replicas>1 or during a
        # rolling update, more than one `migrate` initContainer can run at once.
        # Prisma `migrate deploy` takes a Postgres advisory lock so they
        # SERIALIZE rather than corrupt state — the exposure is only that a
        # second pod could crash-loop on lock-wait if a migration is very slow
        # (this app's migrations are small, so the window is tiny). Deliberately
        # NOT converted to a Helm pre-install/pre-upgrade hook Job in this MR:
        # that changes the migration EXECUTION MODEL (release fails if the hook
        # fails; hook-delete-policy + secret/pull-secret/securityContext all have
        # to be reproduced; the review-only `seed` init ordering shifts) and
        # can't be validated here without a live cluster — exactly the kind of
        # change that could worsen the latent race it means to fix. Tradeoff and
        # a concrete conversion plan (+ prerequisite: cluster validation) are
        # documented against #18/#20; deferred there rather than half-done.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (CI passes $CI_COMMIT_SHA)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dlectroflow-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Reuses the app image; size it like the app so the review
          # ResourceQuota (limits required) is satisfied and Prisma has headroom.
          resources:
            {{- include "dlectroflow.resources" (dict "cpu" .Values.resources.app.cpu "memory" .Values.resources.app.memory "env" .Values.env) | nindent 12 }}
        # #35 Phase A — seed the owner's invitation from OWNER_ALLOWLIST.
        # Sign-in is invite-only from the accounts migration onward, so without
        # this the owner is locked out of their own instance on the first deploy.
        # It runs HERE, after `migrate` and before the app container starts, so
        # the invitation exists before any sign-in can be attempted.
        #
        # A script rather than SQL in the migration: `prisma migrate deploy` runs
        # with only DATABASE_URL and offers no hook to set the Postgres GUC the
        # plan suggested reading, so the SQL version would have silently seeded
        # zero rows. See the header of prisma/seed-allowlist.ts.
        #
        # Idempotent — every deploy re-asserts the invitation without releasing
        # an existing claim. Exits non-zero on a real DB failure so a broken
        # deploy is visible rather than producing a silently locked-out app.
        - name: seed-allowlist
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (CI passes $CI_COMMIT_SHA)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "tsx", "prisma/seed-allowlist.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dlectroflow-secrets
                  key: DATABASE_URL
            - name: AUTH_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: dlectroflow-secrets
                  key: AUTH_PROVIDER
            - name: OWNER_ALLOWLIST
              valueFrom:
                secretKeyRef:
                  name: dlectroflow-secrets
                  key: OWNER_ALLOWLIST
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Sized like `migrate`; initContainers run sequentially, so this does
          # not raise the pod's effective resource request.
          resources:
            {{- include "dlectroflow.resources" (dict "cpu" .Values.resources.app.cpu "memory" .Values.resources.app.memory "env" .Values.env) | nindent 12 }}
        {{- if eq .Values.env "review" }}
        # Review apps ONLY (#25): seed a small demo data set so the review app
        # has content across the inbox buckets instead of an empty sandbox. Runs
        # after `migrate`, reusing the app image (which carries the Prisma CLI +
        # tsx via Dockerfile.ci). Never rendered for production; prisma/seed.ts
        # ALSO self-guards via assertReviewEnv (defense in depth), and is
        # best-effort — a seed failure logs and exits 0 so it can't block the
        # deploy. Sized like `migrate`, and since initContainers run
        # sequentially it doesn't raise the pod's effective resource request, so
        # the review-only ResourceQuota is unaffected.
        - name: seed
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (CI passes $CI_COMMIT_SHA)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "tsx", "prisma/seed.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dlectroflow-secrets
                  key: DATABASE_URL
            # Positive review signal for prisma/seed.ts's assertReviewEnv guard.
            - name: SEED_REVIEW_APP
              value: "1"
            # Also pass env so the guard hard-refuses if this ever renders in prod.
            - name: APP_ENV
              value: {{ .Values.env | quote }}
            - name: REVIEW_DEMO_WS
              value: {{ .Values.reviewDemoWorkspaceId | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- include "dlectroflow.resources" (dict "cpu" .Values.resources.app.cpu "memory" .Values.resources.app.memory "env" .Values.env) | nindent 12 }}
        {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (CI passes $CI_COMMIT_SHA)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # Immutable root FS completes the hardening story. The Next.js
            # standalone server only needs two writable paths, mounted as
            # emptyDir below: /tmp, and /app/.next/cache (the default
            # incremental-cache handler — revalidatePath/revalidateTag write
            # here). Not applied to the migrate/seed initContainers, which run
            # `npx` and need a writable HOME/TMPDIR.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          env:
            # Pins the external origin for OAuth redirect URIs (defense-in-depth
            # vs. Host/X-Forwarded-* spoofing). requestOrigin() prefers this.
            - name: PUBLIC_ORIGIN
              value: "https://{{ .Values.host }}"
            {{- if eq .Values.env "review" }}
            # Review apps ONLY (#25): seat guests into the shared, pre-seeded
            # demo workspace (see src/proxy.ts). Unset in production, where each
            # guest keeps getting an isolated random workspace.
            - name: REVIEW_DEMO_WS
              value: {{ .Values.reviewDemoWorkspaceId | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: dlectroflow-secrets
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          # Process-only liveness (#21 P4): /api/health runs SELECT 1, so
          # pointing liveness at it meant a Postgres blip restarted every app
          # pod (initContainer storm). Liveness now only proves the process
          # serves; the DB check stays on readiness, which just pulls the pod
          # from rotation until Postgres is back.
          livenessProbe:
            httpGet: { path: /api/livez, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- include "dlectroflow.resources" (dict "cpu" .Values.resources.app.cpu "memory" .Values.resources.app.memory "env" .Values.env) | nindent 12 }}
          # Writable scratch required under readOnlyRootFilesystem (above).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: next-cache
          emptyDir:
            # sizeLimit is a HARD kubelet eviction boundary: if the ISR on-disk
            # cache (revalidatePath/revalidateTag) exceeds it the pod is evicted
            # immediately (surfaces like an OOM kill but is a storage-limit
            # eviction). 1Gi gives the ISR cache comfortable headroom for this
            # app's route count. If the cache ever approaches this limit, bound
            # its growth at the app level (a custom Next cache handler /
            # NEXT_CACHE_* config) rather than only raising this number.
            sizeLimit: 1Gi
