apiVersion: v1
kind: Secret
metadata:
  name: dlectroflow-secrets
  labels:
    {{- include "dlectroflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "dlectroflow.databaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  # Owner auth — ALL envs (the boot guard requires these to start).
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  OWNER_ALLOWLIST: {{ .Values.auth.ownerAllowlist | quote }}
  AUTH_SESSION_SECRET: {{ .Values.secrets.authSessionSecret | quote }}
  GITLAB_OAUTH_CLIENT_ID: {{ .Values.secrets.gitlabOauthClientId | quote }}
  GITLAB_OAUTH_CLIENT_SECRET: {{ .Values.secrets.gitlabOauthClientSecret | quote }}
  # Phase 2 — guest IP-hash salt. Boot guard requires this in all envs (the image
  # runs NODE_ENV=production, so review apps enforce it too).
  GUEST_IP_HASH_SALT: {{ .Values.secrets.guestIpHashSalt | quote }}
  TOKEN_ENC_KEY: {{ .Values.secrets.tokenEncKey | quote }}
  {{- if .Values.backup.b2.enabled }}
  # Read only by the backup CronJob's upload-b2 container, never by the app.
  # Scope this key Write Only, to the one bucket, restricted to the `pg/`
  # prefix. It cannot download a backup, delete one, or see any other prefix.
  B2_KEY_ID: {{ .Values.secrets.b2KeyId | quote }}
  B2_APP_KEY: {{ .Values.secrets.b2AppKey | quote }}
  {{- end }}
  {{- if eq .Values.env "production" }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  ROUNDUP_FROM_EMAIL: {{ .Values.secrets.roundupFromEmail | quote }}
  {{- end }}

  # ── Optional app tuning (#135) ─────────────────────────────────────────────
  # Instance parity. Every key below was already tunable on the Docker Compose
  # self-host path (.env.prod.example) and had NO chart equivalent, so the
  # Kubernetes instance could not change an LLM provider or a guest quota
  # without editing this chart — the opposite of the env-driven design. Both
  # surfaces are now diffed by src/lib/env-drift.test.ts, which fails the build
  # on any undeclared divergence.
  #
  # These are non-secret config, and they live in the Secret rather than a new
  # ConfigMap on purpose: AUTH_PROVIDER and OWNER_ALLOWLIST above are the same
  # shape, the app container's only env source is `envFrom: secretRef` on this
  # one object, and the deployment's checksum/secret annotation already rolls
  # pods whenever it changes. A ConfigMap would mean a second envFrom source and
  # a second checksum annotation to keep in step, for no isolation gain (both
  # objects are namespace-scoped and readable by the same ServiceAccount).
  # LLM_API_KEY is a real credential and comes from .Values.secrets.
  #
  # EACH KEY RENDERS ONLY WHEN NON-EMPTY, and that matters: several readers use
  # `??`, which falls back on undefined but NOT on "". Rendering
  # GUEST_SANDBOX_TTL_HOURS: "" would make Number("") === 0 in src/lib/purge.ts
  # and expire every guest workspace instantly; GOOGLE_TASKS_LIST_NAME: "" would
  # search for a list with no name; LLM_PROVIDER: "" logs an unknown-provider
  # warning on every request. `ne (toString …) ""` rather than a bare `if` so a
  # deliberate `--set llm.supportsTools=false` (Helm coerces that to the BOOLEAN
  # false, which a bare `if` treats as unset) and `--set guest.aiWindowHours=0`
  # both still render.
  {{- if ne (toString .Values.llm.provider) "" }}
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  {{- end }}
  {{- if ne (toString .Values.llm.baseUrl) "" }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  {{- end }}
  {{- if ne (toString .Values.llm.model) "" }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  {{- end }}
  {{- if ne (toString .Values.secrets.llmApiKey) "" }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  {{- end }}
  {{- if ne (toString .Values.llm.ownerModel) "" }}
  LLM_OWNER_MODEL: {{ .Values.llm.ownerModel | quote }}
  {{- end }}
  {{- if ne (toString .Values.llm.guestModel) "" }}
  LLM_GUEST_MODEL: {{ .Values.llm.guestModel | quote }}
  {{- end }}
  {{- if ne (toString .Values.llm.supportsTools) "" }}
  LLM_SUPPORTS_TOOLS: {{ .Values.llm.supportsTools | quote }}
  {{- end }}
  {{- if ne (toString .Values.llm.ownerBreakdownModel) "" }}
  OWNER_BREAKDOWN_MODEL: {{ .Values.llm.ownerBreakdownModel | quote }}
  {{- end }}
  {{- if ne (toString .Values.llm.guestBreakdownModel) "" }}
  GUEST_BREAKDOWN_MODEL: {{ .Values.llm.guestBreakdownModel | quote }}
  {{- end }}
  {{- if ne (toString .Values.google.tasksListName) "" }}
  GOOGLE_TASKS_LIST_NAME: {{ .Values.google.tasksListName | quote }}
  {{- end }}
  {{- if ne (toString .Values.scheduling.syntax) "" }}
  SCHEDULING_SYNTAX: {{ .Values.scheduling.syntax | quote }}
  {{- end }}
  {{- if ne (toString .Values.scheduling.timezone) "" }}
  SCHEDULING_TIMEZONE: {{ .Values.scheduling.timezone | quote }}
  {{- end }}
  {{- if ne (toString .Values.guest.aiQuotaPerWindow) "" }}
  GUEST_AI_QUOTA_PER_WINDOW: {{ .Values.guest.aiQuotaPerWindow | quote }}
  {{- end }}
  {{- if ne (toString .Values.guest.aiWindowHours) "" }}
  GUEST_AI_WINDOW_HOURS: {{ .Values.guest.aiWindowHours | quote }}
  {{- end }}
  {{- if ne (toString .Values.guest.globalDailyCap) "" }}
  GUEST_GLOBAL_DAILY_GUEST_CAP: {{ .Values.guest.globalDailyCap | quote }}
  {{- end }}
  {{- if ne (toString .Values.guest.sandboxTtlHours) "" }}
  GUEST_SANDBOX_TTL_HOURS: {{ .Values.guest.sandboxTtlHours | quote }}
  {{- end }}
  {{- if ne (toString .Values.user.aiWindowHours) "" }}
  USER_AI_WINDOW_HOURS: {{ .Values.user.aiWindowHours | quote }}
  {{- end }}
