apiVersion: v1
kind: Secret
metadata:
  name: dlectroflow-secrets
  labels:
    {{- include "dlectroflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "dlectroflow.databaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  # Owner auth — ALL envs (the boot guard requires these to start).
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  OWNER_ALLOWLIST: {{ .Values.auth.ownerAllowlist | quote }}
  AUTH_SESSION_SECRET: {{ .Values.secrets.authSessionSecret | quote }}
  GITLAB_OAUTH_CLIENT_ID: {{ .Values.secrets.gitlabOauthClientId | quote }}
  GITLAB_OAUTH_CLIENT_SECRET: {{ .Values.secrets.gitlabOauthClientSecret | quote }}
  # Phase 2 — guest IP-hash salt. Boot guard requires this in all envs (the image
  # runs NODE_ENV=production, so review apps enforce it too).
  GUEST_IP_HASH_SALT: {{ .Values.secrets.guestIpHashSalt | quote }}
  {{- if eq .Values.env "production" }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  ROUNDUP_FROM_EMAIL: {{ .Values.secrets.roundupFromEmail | quote }}
  {{- end }}
