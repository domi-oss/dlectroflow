# Custom GitLab Secret Detection ruleset.
#
# Extends the analyzer's built-in gitleaks config with an allowlist for the
# committed .env TEMPLATE and the deployment-planning docs. Those files contain
# a localhost Postgres connection-string PLACEHOLDER (e.g.
# postgresql://dlectroflow:CHANGEME@localhost:5432/…) — no real credential;
# production secrets are injected from GitLab Secrets Manager at deploy time.
#
# Gitleaks' "Password in URL" rule matches the user:pass@host URL *shape*
# heuristically, so it re-flags these every pipeline (vulns 327775962-965,
# 328188454 — all dismissed as false positives). This suppresses those specific
# paths only; every other file is still fully scanned.
[secrets]
  [[secrets.passthrough]]
    type   = "raw"
    target = "gitleaks.toml"
    value  = '''
[extend]
path = "/gitleaks.toml"

[allowlist]
  description = "dlectroflow: documented localhost DB placeholders in the .env template and deployment docs (no real secrets)"
  paths = [
    '\.env\.example$',
    'docs/superpowers/.*dlectroflow-k8s-deployment.*\.md$',
  ]
'''
