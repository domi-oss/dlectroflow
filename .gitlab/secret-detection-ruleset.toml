# Custom GitLab Secret Detection ruleset.
#
# Suppresses the recurring "Password in URL" FALSE POSITIVES for local-dev
# Postgres connection-string PLACEHOLDERS in the committed .env template and the
# deployment-planning docs:
#   postgresql://dlectroflow:dlectroflow@localhost:5432/…    (.env.example, docs)
#   postgresql://dlectroflow:dlectroflow@host.docker.internal:5432/…  (docs runbook)
#   postgresql://dlectroflow:CHANGEME@localhost:5432/…       (kept: older docs/branches)
# (#91 replaced .env.example's CHANGEME with the real Compose password so
# `cp .env.example .env` works on a fresh clone — already covered by the regex
# below, which allows both tokens.)
# These are not real credentials; production secrets come from GitLab Secrets
# Manager. Gitleaks matches the user:pass@host URL shape, so it re-flags these
# every pipeline (327775962-965, 328188454 — all dismissed).
#
# Anti-bypass scoping (this allowlist must not become a detection hole):
#   * regexes, not paths — every other secret rule stays active in every file,
#     so a real key committed to .env.example is still caught. (Note: gitleaks'
#     singular [allowlist] ORs paths+regexes, so adding paths here would BROADEN
#     to "suppress everything in those files" — the opposite of what we want.)
#   * password anchored to the exact known placeholder tokens (CHANGEME |
#     dlectroflow) — a real/auto-generated password can't match, even in a
#     localhost URL.
#   * host must be an EXACT local host terminated by ':' or '/', so a prefix
#     such as @localhost.evil.com / @host.docker.internal.attacker.io is NOT
#     suppressed.
[secrets]
  [[secrets.passthrough]]
    type   = "raw"
    target = "gitleaks.toml"
    value  = '''
[extend]
path = "/gitleaks.toml"

[allowlist]
  description = "dlectroflow: local-dev Postgres placeholders (known tokens @ exact localhost / host.docker.internal only) — never production credentials"
  regexTarget = "line"
  regexes = [
    'postgresql://[a-z0-9_-]+:(CHANGEME|dlectroflow)@(localhost|host\.docker\.internal)[:/]',
  ]
'''
