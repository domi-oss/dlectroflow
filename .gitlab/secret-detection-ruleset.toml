# Custom GitLab Secret Detection ruleset.
#
# Suppresses the recurring "Password in URL" FALSE POSITIVES for local-dev
# Postgres connection-string PLACEHOLDERS in the committed .env template and the
# deployment-planning docs, e.g.
#   postgresql://dlectroflow:CHANGEME@localhost:5432/…
#   postgresql://dlectroflow:dlectroflow@host.docker.internal:5432/…
# These are not real credentials; production secrets come from GitLab Secrets
# Manager. Gitleaks matches the user:pass@host URL shape, so it re-flags these
# every pipeline (327775962-965, 328188454 — all dismissed).
#
# Scope (deliberately narrow to avoid becoming a detection-bypass):
#   * regexes, not paths — so every other secret rule stays active in every
#     file (a real key committed to .env.example is still caught).
#   * password class limited to placeholder shapes ([A-Za-z0-9_-]{1,32}) — a
#     complex/real password won't be auto-allowlisted.
#   * host must be an EXACT local host terminated by ':' or '/' — this prevents
#     a prefix-bypass such as `@localhost.evil.com` or
#     `@host.docker.internal.attacker.io` from being suppressed.
[secrets]
  [[secrets.passthrough]]
    type   = "raw"
    target = "gitleaks.toml"
    value  = '''
[extend]
path = "/gitleaks.toml"

[allowlist]
  description = "dlectroflow: local-dev Postgres placeholders (exact localhost / host.docker.internal only) — never production credentials"
  regexTarget = "line"
  regexes = [
    'postgresql://[a-z0-9_-]+:[A-Za-z0-9_-]{1,32}@(localhost|host\.docker\.internal)[:/]',
  ]
'''
