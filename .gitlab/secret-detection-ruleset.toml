# Custom GitLab Secret Detection ruleset.
#
# Suppresses the recurring "Password in URL" FALSE POSITIVES for local-dev
# Postgres connection-string PLACEHOLDERS in the committed .env template and the
# deployment-planning docs, e.g.
#   postgresql://dlectroflow:CHANGEME@localhost:5432/…
#   postgresql://dlectroflow:dlectroflow@host.docker.internal:5432/…
# These are not real credentials; production secrets come from GitLab Secrets
# Manager. Gitleaks matches the user:pass@host URL shape, so it re-flags these
# every pipeline (327775962-965, 328188454 — all dismissed).
#
# Scope: a `regexes` allowlist (NOT a path allowlist) — it suppresses only
# Postgres URLs pointing at a LOCAL host (localhost / host.docker.internal),
# which are by definition dev placeholders and never production secrets. Every
# other secret rule stays fully active in every file, so a real credential
# accidentally committed anywhere (incl. .env.example) is still caught.
[secrets]
  [[secrets.passthrough]]
    type   = "raw"
    target = "gitleaks.toml"
    value  = '''
[extend]
path = "/gitleaks.toml"

[allowlist]
  description = "dlectroflow: local-dev Postgres placeholders (localhost / host.docker.internal) — never production credentials"
  regexTarget = "line"
  regexes = [
    'postgresql://[a-z0-9_-]+:[^@/\s]+@(localhost|host\.docker\.internal)',
  ]
'''
