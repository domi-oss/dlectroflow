# Pinned, not defaulted. Compose derives the project name from the directory
# holding the compose file, so moving this file into docker/ would silently
# rename the project from `dlectroflow` to `docker` — and with it the volume,
# from `dlectroflow_dlectroflow_pgdata` to `docker_dlectroflow_pgdata`. Every
# developer who already has a local database would get a fresh empty one and
# their data left orphaned under the old name. `docker` is also a name any
# other repo with a docker/ directory would collide on, which is the same trap
# docker-compose.prod.yml documents hitting the hard way.
name: dlectroflow

services:
  db:
    image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
    restart: unless-stopped
    environment:
      POSTGRES_USER: dlectroflow
      POSTGRES_PASSWORD: dlectroflow
      POSTGRES_DB: dlectroflow
    ports:
      - "5432:5432"
    volumes:
      - dlectroflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlectroflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dlectroflow_pgdata:
